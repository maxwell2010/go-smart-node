# Include in a dedicated HTTPS server with nginx-media-limits.conf in http.
location ~ "^/v1/(prepare|publish)$" {
    client_max_body_size 14m;
    client_body_timeout 10s;
    limit_req zone=mcnd_upload_ip burst=4 nodelay;
    limit_req zone=mcnd_upload_origin burst=4 nodelay;
    limit_req_status 429;
    limit_conn mcnd_upload_concurrent 4;
    limit_conn_status 429;
    proxy_request_buffering on;
    proxy_read_timeout 70s;
    proxy_pass http://127.0.0.1:8910;
}

location ~ "^/ipfs/bafkrei[a-z2-7]{52}$" {
    proxy_pass http://127.0.0.1:8910;
}

location / {
    return 404;
}
