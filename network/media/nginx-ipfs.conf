# Include in the server block of a dedicated origin with root pointing at the
# exported public directory. The deployment supplies the listener and TLS.
location ~ "^/ipfs/(?<mcnd_media_cid>(?:bafkrei|bafybei)[a-z2-7]{52})$" {
    types {
        image/png png;
        application/json json;
    }
    default_type application/octet-stream;
    limit_except GET { deny all; }
    disable_symlinks on;
    try_files /ipfs/$mcnd_media_cid.png /ipfs/$mcnd_media_cid.json =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Referrer-Policy no-referrer always;
}

location / {
    return 404;
}
