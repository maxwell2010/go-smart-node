syntax = "proto3";
package decimal.nft.v1;

import "gogoproto/gogo.proto";

import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "github.com/maxwell2010/go-smart-node/network/decimal/nft/types";

// StakeType is the type of a delegation stake.
enum NftType {
  option (gogoproto.goproto_enum_prefix) = true;

  // UNSPECIFIED defines an invalid stake type.
  NFT_TYPE_UNSPECIFIED = 0 [ (gogoproto.enumvalue_customname) = "Unspecified" ];
  // COIN defines the type for stakes in coin.
  NFT_TYPE_721 = 1 [ (gogoproto.enumvalue_customname) = "NFT721" ];
  // NFT defines the type for stakes in NFT.
  NFT_TYPE_1155 = 2 [ (gogoproto.enumvalue_customname) = "NFT1155" ];
}

// Collection defines NFT collection which is just a set of NFT tokens.
message Collection {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = true;

  // creator defines address of the NFT collection creator.
  string creator = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // denom defines the NFT collection name.
  string denom = 2;
  // supply defines total count of NFT tokens containing in the collection.
  uint32 supply = 3;

  // tokens defines the list of NFT tokens containing in the NFT collection.
  repeated Token tokens = 4 [ (gogoproto.castrepeated) = "Tokens" ];

  // type of nft on drc type contract.
  NftType typeNft = 5;

  // address nft defines the NFT collection name.
  string addressDRC = 6;
  bool reserve_less = 7;
  string external_symbol = 8;
  string external_name = 9;
}

// CollectionCounter defines object containing counter of minted NFT tokens in the collection.
message CollectionCounter {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = true;

  // supply defines total count of minted NFT tokens in the collection.
  uint32 supply = 1;
}

// Token defines NFT token.
message Token {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = true;

  // creator defines address of the NFT collection creator.
  string creator = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // denom defines the NFT collection name.
  string denom = 2;
  // id defines unique NFT token ID.
  string id = 3 [ (gogoproto.customname) = "ID" ];
  // uri defines URI to the NFT token metadata.
  string uri = 4 [ (gogoproto.customname) = "URI" ];
  // reserve defines default reserve of each minted NFT sub-token.
  cosmos.base.v1beta1.Coin reserve = 5 [ (gogoproto.nullable) = false ];
  // allow_mint defines ability to mint additional NFT sub-tokens.
  bool allow_mint = 6;
  // minted defines total count of minted NFT sub-tokens.
  uint32 minted = 7;
  // burnt defines total count of burnt NFT sub-tokens.
  uint32 burnt = 8;

  // sub_tokens defines the list of NFT sub-tokens existing in the NFT token.
  repeated SubToken sub_tokens = 9 [ (gogoproto.castrepeated) = "SubTokens" ];
  bool reserve_less = 10;
  // Explicit known-vault receipt profile, including genuinely zero-backed children.
  bool isolated_receipt = 11;
}

// ExternalNFTBinding is the unique, explicit external/native identity mapping.
// uint256 IDs retain all 32 bytes; next_sub_token_id is a never-reused cursor.
message ExternalNFTBinding {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = true;
  string chain_id = 1 [ (gogoproto.customname) = "ChainID" ];
  uint64 evm_chain_id = 2 [ (gogoproto.customname) = "EVMChainID" ];
  bytes contract = 3;
  bytes token_id = 4 [ (gogoproto.customname) = "TokenID" ];
  string native_token_id = 5 [ (gogoproto.customname) = "NativeTokenID" ];
  NftType nft_type = 6 [ (gogoproto.customname) = "NFTType" ];
  uint64 next_sub_token_id = 7 [ (gogoproto.customname) = "NextSubTokenID" ];
}

// TokenCounter defines object containing counters of minted and burnt NFT sub-tokens.
message TokenCounter {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = true;

  // minted defines total count of minted NFT sub-tokens.
  uint32 minted = 1;
  // burnt defines total count of burnt NFT sub-tokens.
  uint32 burnt = 2;
}

// SubToken defines NFT sub-token.
message SubToken {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = true;

  // id defines NFT sub-token internal ID in the parent NFT token.
  uint32 id = 1 [ (gogoproto.customname) = "ID" ];
  // owner defines address of the current owner of the NFT sub-token.
  string owner = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // reserve defines reserve of the NFT sub-token.
  cosmos.base.v1beta1.Coin reserve = 3;
}

// IsolatedVaultState preserves the next never-reused receipt ID even when all
// older receipts have been closed and their current-state records compacted.
message IsolatedVaultState {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  string chain_id = 1 [ (gogoproto.customname) = "ChainID" ];
  uint64 evm_chain_id = 2 [ (gogoproto.customname) = "EVMChainID" ];
  bytes vault = 3;
  bytes next_position_id = 4 [ (gogoproto.customname) = "NextPositionID" ];
  string receipt_creator = 5;
  string receipt_denom = 6;
}

// IsolatedReserveSnapshot is declared contract collateral, not an inferred bank
// balance or governance voting claim after pending liabilities. Amount retains
// all uint256 bytes; zero remains backed DEL/DRC20 rather than reserve-less.
message IsolatedReserveSnapshot {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  uint32 kind = 1;
  bytes token = 2;
  bytes amount = 3;
}

// IsolatedPositionLineage belongs to every live receipt, in a wallet or escrow.
// It archives the exact burned origin units and does not depend on a live parent.
message IsolatedPositionLineage {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;
  bytes vault = 1;
  bytes position_id = 2 [ (gogoproto.customname) = "PositionID" ];
  string receipt_native_token_id = 3 [ (gogoproto.customname) = "ReceiptNativeTokenID" ];
  uint32 receipt_sub_token_id = 4 [ (gogoproto.customname) = "ReceiptSubTokenID" ];
  bytes origin_contract = 5;
  bytes origin_token_id = 6 [ (gogoproto.customname) = "OriginTokenID" ];
  string origin_native_token_id = 7 [ (gogoproto.customname) = "OriginNativeTokenID" ];
  repeated uint32 origin_sub_token_ids = 8 [ (gogoproto.customname) = "OriginSubTokenIDs" ];
  bytes parent_position_id = 9 [ (gogoproto.customname) = "ParentPositionID" ];
  IsolatedReserveSnapshot reserve = 10 [ (gogoproto.nullable) = false ];
}
