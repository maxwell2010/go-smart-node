syntax = "proto3";
package decimal.nft.v1;

import "gogoproto/gogo.proto";

import "cosmos_proto/cosmos.proto";

import "decimal/nft/v1/nft.proto";
import "decimal/nft/v1/params.proto";

option go_package = "github.com/maxwell2010/go-smart-node/network/decimal/nft/types";

// GenesisState defines the module's genesis state.
message GenesisState {
  option (gogoproto.equal) = true;
  // collections defines all existing NFT collections (including tokens and sub-tokens).
  repeated Collection collections = 1 [ (gogoproto.nullable) = false ];
  // params defines all the module's parameters.
  Params params = 2 [ (gogoproto.nullable) = false ];
  repeated ExternalNFTBinding external_bindings = 3 [ (gogoproto.nullable) = false ];
  repeated IsolatedVaultState isolated_vaults = 4 [ (gogoproto.nullable) = false ];
  repeated IsolatedPositionLineage isolated_positions = 5 [ (gogoproto.nullable) = false ];
}
