syntax = "proto3";
package decimal.validator.v1;

import "gogoproto/gogo.proto";

import "cosmos_proto/cosmos.proto";

import "google/protobuf/timestamp.proto";

import "decimal/validator/v1/validator.proto";
import "decimal/validator/v1/params.proto";
import "decimal/validator/v1/binding.proto";

option go_package = "github.com/maxwell2010/go-smart-node/network/decimal/validator/types";

// GenesisState defines the module's genesis state.
message GenesisState {
  // validators defines the validator set at genesis.
  repeated Validator validators = 1 [ (gogoproto.nullable) = false ];
  // delegations defines the delegations bonded to validators at genesis.
  repeated Delegation delegations = 2 [ (gogoproto.nullable) = false ];
  // undelegations defines the undelegations active at genesis.
  repeated Undelegation undelegations = 3 [ (gogoproto.nullable) = false ];
  // redelegations defines the redelegations active at genesis.
  repeated Redelegation redelegations = 4 [ (gogoproto.nullable) = false ];
  // last_validator_powers defines a historical list of the last-block's bonded validators.
  repeated LastValidatorPower last_validator_powers = 5 [ (gogoproto.nullable) = false ];
  // last_total_power tracks the total amounts of validators power recorded during the previous end block.
  int64 last_total_power = 6;
  // params defines all the module's parameters.
  Params params = 7 [ (gogoproto.nullable) = false ];
  // exported is true if genesis was exported from the state.
  bool exported = 8;
  // validator_offline_since contains offline-since timestamps for auto-unbond tracking.
  repeated ValidatorOfflineSince validator_offline_since = 9 [ (gogoproto.nullable) = false ];
  // New-network consensus pipeline. Exactly two consecutive effective heights
  // survive each committed EndBlock; independent of historical retention.
  repeated ScheduledValidatorSet scheduled_validator_sets = 10 [ (gogoproto.nullable) = false ];
  EVMSourceDomain binding_domain = 11;
  repeated EVMStakeBinding evm_stake_bindings = 12 [(gogoproto.customname)="EVMStakeBindings",(gogoproto.nullable)=false];
  repeated EVMFrozenBinding evm_frozen_bindings = 13 [(gogoproto.customname)="EVMFrozenBindings",(gogoproto.nullable)=false];
  uint64 binding_revision = 14;
  repeated EVMValidatorHeader evm_validator_headers = 15 [(gogoproto.customname)="EVMValidatorHeaders", (gogoproto.nullable)=false];
}

// ValidatorOfflineSince stores when a validator went offline for auto-unbond tracking.
message ValidatorOfflineSince {
  string validator_address = 1 [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
  google.protobuf.Timestamp offline_since = 2
      [ (gogoproto.nullable) = false, (gogoproto.stdtime) = true ];
}

// LastValidatorPower defines an object containing a pair of validator address and it's voting power.
message LastValidatorPower {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  // address is the address of the validator.
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // power defines the voting power of the validator.
  int64 power = 2;
}

// ScheduledValidatorSet retains the exact future effective set across restart.
// Existing mainnet database layouts are not migrated by this new-network field.
message ScheduledValidatorSet {
  int64 effective_height = 1;
  repeated Validator validators = 2 [ (gogoproto.nullable) = false ];
}
