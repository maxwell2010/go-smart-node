name: Public launch draft checks
on:
  workflow_dispatch:
    inputs:
      published_onboarding:
        description: Run the installation guides and verify the signed public genesis offline
        type: boolean
        default: false
      published_install_122:
        description: Execute both public 1.2.2 one-line installers with a clean HOME
        type: boolean
        default: false
  push:
    branches: ['feat/native-duplicate-vote-master-20261112', 'release/**']
    paths:
      - '.github/workflows/public-launch-draft.yml'
      - 'network/docs/ru/*LAUNCH*.md'
      - 'network/docs/ru/*BOOTSTRAP*.md'
      - 'network/docs/ru/public-*.draft.json'
      - 'network/docs/ru/operator-launch-intake.example.json'
      - 'network/tools/check_public_launch_draft.py'
      - 'network/tools/test_check_public_launch_draft.py'
      - 'network/tools/check_operator_applications.py'
      - 'network/tools/test_check_operator_applications.py'
      - 'network/tools/native_launch_allocation.py'
      - 'network/tools/test_native_launch_allocation.py'
      - 'network/tools/prepare_founding_ledger.py'
      - 'network/tools/verify_public_launch_genesis.py'
      - 'network/tools/test_verify_public_launch_genesis.py'
      - 'network/tools/*genesis_manifest.py'
      - 'network/tools/*install_validator_genesis.py'
      - 'network/tools/configure_history.py'
      - 'network/tools/*native_launch_package.py'
      - 'network/docs/ru/evidence/software-release-*.json'
      - 'network/tools/withdrawal_genesis_smoke.py'
  pull_request:
    paths:
      - '.github/workflows/public-launch-draft.yml'
      - 'network/docs/ru/public-*.draft.json'
      - 'network/docs/ru/operator-launch-intake.example.json'
      - 'network/tools/check_public_launch_draft.py'
      - 'network/tools/test_check_public_launch_draft.py'
      - 'network/tools/check_operator_applications.py'
      - 'network/tools/test_check_operator_applications.py'
      - 'network/tools/native_launch_allocation.py'
      - 'network/tools/test_native_launch_allocation.py'
      - 'network/tools/prepare_founding_ledger.py'
      - 'network/tools/verify_public_launch_genesis.py'
      - 'network/tools/test_verify_public_launch_genesis.py'
      - 'network/tools/*genesis_manifest.py'
      - 'network/tools/*install_validator_genesis.py'
      - 'network/tools/configure_history.py'
      - 'network/tools/*native_launch_package.py'
      - 'network/docs/ru/evidence/software-release-*.json'
      - 'network/tools/withdrawal_genesis_smoke.py'
permissions:
  contents: read
jobs:
  published-onboarding:
    if: (inputs.published_onboarding || inputs.published_install_122) && github.repository == 'maxwell2010/go-smart-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute the documented installation commands and validate the mainnet home
        if: inputs.published_onboarding
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          command -v gh gpgv jq
          work=$(mktemp -d "$RUNNER_TEMP/onboarding.XXXXXXXX")
          export HOME="$work/home" GH_CONFIG_DIR="$work/gh" GH_PROMPT_DISABLED=1
          unset GH_TOKEN GITHUB_TOKEN
          mkdir -p -- "$HOME" "$RUNNER_TEMP/onboarding-evidence"
          evidence="$RUNNER_TEMP/onboarding-evidence"
          releases='https://github.com/maxwell2010/go-smart-node/releases/download'
          curl -fsSL --proto '=https' --proto-redir '=https' "$releases/v1.2.0/INSTALL_RU.md" -o "$work/foundation.md"
          curl -fsSL --proto '=https' --proto-redir '=https' "$releases/v1.2.1-testnet/INSTALL_TESTNET_RU.md" -o "$work/testnet.md"
          printf '%s  %s\n' \
            4b34669d2f4cfb734ac8289c7f7757142932b50354b5b51615c9e5b2218947df "$work/foundation.md" \
            6c9d79279da6288bda1470c5a35ad216563cfbab4650483227e9114f359bab62 "$work/testnet.md" | sha256sum --check --strict
          run_guide() {
            python3 -B - "$1" "$2" <<'PY' | bash
          from pathlib import Path
          import re
          import sys

          guide = Path(sys.argv[1]).read_text(encoding="utf-8")
          section = guide.split(f"## {sys.argv[2]}\n", 1)[1].split("\n## ", 1)[0]
          commands, = re.findall(r"(?m)^```sh\n([\s\S]*?)^```\s*$", section)
          print(commands)
          PY
          }
          guide=network/docs/ru/INSTALL_RU.md
          run_guide "$guide" 'Быстрая установка бинарника' > "$evidence/msp-install.json"
          run_guide "$work/foundation.md" 'Быстрая установка бинарника' > "$evidence/foundation-install.json"
          run_guide "$work/testnet.md" 'Быстрая установка' > "$evidence/tmsp-install.json"
          run_guide "$guide" 'Новая нода из подписанного genesis' > "$work/home-validation.log"
          jq -Rsc '[split("\n")[] | fromjson? | select(.status == "OBSERVER_GENESIS_INSTALLED")] | if length == 1 then .[0] else error("observer install report missing") end' \
            "$work/home-validation.log" > "$evidence/observer.json"
          jq -e '.releaseVersion == "1.2.1" and .nativeDenom == "msp" and
              .binarySha256 == "dc3fa4e88fe03173d81a03e2cc7ae75b17f8960ed2e8a1775130cd7aa0bf6c84"' "$evidence/msp-install.json" >/dev/null
          jq -e '.releaseVersion == "1.2.0" and .nativeDenom == "msp"' "$evidence/foundation-install.json" >/dev/null
          jq -e '.releaseVersion == "1.2.1" and .nativeDenom == "tmsp" and
              .binarySha256 == "8e43c5946a6c8e6da97b69c6e5330e3feaff79b7ec0c414701f8702168525c75"' "$evidence/tmsp-install.json" >/dev/null
          jq -e '.changed and .genesisSha256 == "cbb4e0c1a060b09e9fb45204c1f2de16d4be37d67753378b06782abeaebf8117" and
              .signerFingerprint == "E6F019522D030B2F37249D4B7903FAD265CBFDB9" and
              .publicP2P.persistent_peers == "0a7d73e4af46c1e56f6e738d34fb0f48e37997f7@node4.mintcandy.pro:36657" and
              .publicP2P.seeds == "" and .networkLaunchAuthorized == false' "$evidence/observer.json" >/dev/null
          home="$HOME/.mintcandy-mainnet"
          printf '%s  %s\n' 'cbb4e0c1a060b09e9fb45204c1f2de16d4be37d67753378b06782abeaebf8117' \
            "$home/config/genesis.json" | sha256sum --check --strict
          jq -e '.height == "0"' "$home/data/priv_validator_state.json" >/dev/null
          jq -e '.chain_id == "mintcandy_9905401-1" and
            .app_state.gov.params.min_deposit == [{"amount":"10000000000000000000","denom":"msp"}] and
            .app_state.gov.params.voting_period == "172800s" and
            ([.. | objects | select(has("enable_native_upgrade_governance")) |
              .enable_native_upgrade_governance] == [true])' "$home/config/genesis.json" >/dev/null
          upgrade_guide="$GITHUB_WORKSPACE/network/docs/ru/GOVERNED_UPGRADE_1_2_2.md"
          export MCND_HOME="$home" KEYRING_BACKEND=test PROPOSER_KEY=review-only
          export UPGRADE_HEIGHT=123456 DEPOSIT_ATOMIC=10000000000000000000
          binary="$HOME/.local/opt/mcnd/1.2.1-msp/mcnd"
          "$binary" keys add "$PROPOSER_KEY" --home "$MCND_HOME" --keyring-backend test >/dev/null 2>&1
          proposer=$("$binary" keys show "$PROPOSER_KEY" --home "$MCND_HOME" --keyring-backend test -a)
          cd "$work"
          run_guide "$upgrade_guide" 'Черновик предложения до голосования'
          run_guide "$upgrade_guide" 'Проверка предложения бинарником 1.2.1' > unsigned.json
          jq -e --arg proposer "$proposer" '
            .signatures == [] and (.body.messages | length) == 1 and
            (.body.messages[0] |
              .["@type"] == "/cosmos.gov.v1.MsgSubmitProposal" and .proposer == $proposer and
              .messages == [] and .expedited == false and
              .initial_deposit == [{"amount":"10000000000000000000","denom":"msp"}] and
              .metadata == "mintcandy-sdk-upgrade/v1:{\"name\":\"mintcandy-native-sdk-migrations-v1\",\"height\":123456}")' unsigned.json >/dev/null || { cat unsigned.json; exit 1; }
          cp unsigned.json "$evidence/unsigned-upgrade-example.json"
      - name: Execute the public MSP and tMSP 1.2.2 one-line installers
        if: inputs.published_install_122
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/install122.XXXXXXXX")
          export HOME="$work/home" GH_CONFIG_DIR="$work/gh" GH_PROMPT_DISABLED=1
          unset GH_TOKEN GITHUB_TOKEN
          evidence="$RUNNER_TEMP/onboarding-evidence"
          mkdir -p -- "$HOME" "$evidence"
          source=c7c1331a201cd2141cf9d90493fbed539bf62642
          releases='https://github.com/maxwell2010/go-smart-node/releases/download'
          for denom in msp tmsp; do
            if [[ "$denom" == msp ]]; then
              tag=v1.2.2
              guide=INSTALL_RU.md
              expected=INSTALL_1_2_2_RU.md
              binary_sha=b098a5174fd7df151dfaf7740362e1c1c782726b925f1439340eec112338d1d2
              evm=9905401
            else
              tag=v1.2.2-testnet
              guide=INSTALL_TESTNET_RU.md
              expected=INSTALL_TESTNET_1_2_2_RU.md
              binary_sha=5a88caab856f4725d281694a2ece4672a96fd98a488d14faad17d9b318a8371d
              evm=990098
            fi
            curl -fsSL --proto '=https' --proto-redir '=https' "$releases/$tag/$guide" -o "$work/$guide"
            cmp "$work/$guide" "network/docs/ru/$expected"
            python3 -B - "$work/$guide" <<'PY' | bash > "$evidence/$denom-install-122.json"
          from pathlib import Path
          import re
          import sys

          guide = Path(sys.argv[1]).read_text(encoding="utf-8")
          section = guide.split("## Быстрая установка\n", 1)[1].split("\n## ", 1)[0]
          command, = re.findall(r"(?m)^```sh\n([\s\S]*?)^```\s*$", section)
          if len(command.strip().splitlines()) != 1:
              raise SystemExit("installation guide must contain exactly one command line")
          print(command)
          PY
            binary="$HOME/.local/opt/mcnd/1.2.2-$denom/mcnd"
            printf '%s  %s\n' "$binary_sha" "$binary" | sha256sum --check --strict
            jq -e --arg denom "$denom" --arg sha "$binary_sha" --arg source "$source" --arg path "$binary" '
              .releaseVersion == "1.2.2" and .nativeDenom == $denom and .binarySha256 == $sha and
              .sourceRevision == $source and .binary == $path and .includesGenesis == false and .networkLaunchApproved == false
              ' "$evidence/$denom-install-122.json" >/dev/null
            node_home="$work/node-$denom"
            "$binary" init install-check --home "$node_home" --chain-id "mintcandy_${evm}-1" --evm.evm-chain-id "$evm" >/dev/null
            "$binary" genesis validate-genesis --home "$node_home" --chain-id "mintcandy_${evm}-1" --evm.evm-chain-id "$evm"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-onboarding-${{ github.sha }}
          path: ${{ runner.temp }}/onboarding-evidence/*.json
          if-no-files-found: error
          retention-days: 30
  draft-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject inconsistent or accidentally approved launch templates
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s network/tools -p 'test_check_public_launch_draft.py'
          python3 -B network/tools/check_public_launch_draft.py > "$RUNNER_TEMP/public-launch-draft-checks.json"
          git diff --exit-code
      - name: Verify draft and populated operator preflight scenarios
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s network/tools -p 'test_check_operator_applications.py' -v
          python3 -B network/tools/check_operator_applications.py network/docs/ru/operator-launch-intake.example.json > "$RUNNER_TEMP/operator-application-template-check.json"
          jq -e '.status == "APPLICATIONS_PENDING" and .checkedOperators == 0 and .missingSlots == 4 and .publicGenesisApproved == false' \
            "$RUNNER_TEMP/operator-application-template-check.json" >/dev/null
      - name: Verify candidate balances and operator identities at unchanged supply
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s network/tools -p 'test_native_launch_allocation.py' -v
          python3 -B -m unittest discover -s network/tools -p 'test_verify_public_launch_genesis.py' -v
      - name: Verify detached public genesis signatures and reject substituted inputs
        run: |
          set -euo pipefail
          command -v gpg gpgv gpgconf
          python3 -B -m unittest discover -s network/tools -p 'test_public_genesis_manifest.py' -v
          python3 -B -m unittest discover -s network/tools -p 'test_install_validator_genesis.py' -v
          python3 -B -m unittest discover -s network/tools -p 'test_native_launch_package.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-launch-draft-checks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/public-launch-draft-checks.json
            ${{ runner.temp }}/operator-application-template-check.json
          if-no-files-found: error
          retention-days: 30
