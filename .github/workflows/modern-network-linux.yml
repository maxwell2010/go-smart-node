name: Modern network validation

on:
  push:
    branches: ['integration/**', 'network/**', 'release/**']
    paths: ['network/**', 'scripts/audit/**', '.github/workflows/modern-network-linux.yml']
  pull_request:
    paths: ['network/**', 'scripts/audit/**', '.github/workflows/modern-network-linux.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scenario to run on an isolated GitHub runner
        default: module
        type: choice
        options: [module, founding-genesis, bridge-finality, token-features, token-daemon, mass-delegation, mass-delegation-release, contracts, process, held-downtime, native-upgrade-governance, nft-downtime, native-full-profile-upgrade, native-full-ibc-upgrade, native-cross-version-ibc-upgrade, native-systemd-module-upgrade, native-systemd-four-validator-recovery, native-systemd-startup-replay]
      remote_profile:
        description: Also validate the reusable remote-worker scripts
        default: 'off'
        type: choice
        options: ['off', modern-smoke, modern-full]
      withdrawal_genesis:
        description: Also boot the private authenticated NFT withdrawal and DEL delegation genesis fixtures
        default: false
        type: boolean
      del_state_sync:
        description: Also restore the DEL fixture over isolated P2P and verify replay
        default: false
        type: boolean
      ibc_client_upgrade:
        description: Also rehearse a same-family daemon replacement and proof-based Hermes client upgrade
        default: false
        type: boolean
      native_consensus:
        description: Also check a signed native consensus transition on three isolated mcnd nodes
        default: false
        type: boolean
      native_fee_rewards:
        description: Check the native consensus transition with fee-only rewards on three isolated nodes
        default: false
        type: boolean
      native_ibc_v1:
        description: Check bank ICS-20 v1 with three native nodes, fee rewards, Hermes and an independent chain
        default: false
        type: boolean
      native_del_downtime:
        description: Check an ordinary DEL downtime penalty and follower catch-up on three isolated nodes
        default: false
        type: boolean
      native_del_jail_recovery:
        description: Check signed ordinary DEL jail recovery and H+2 re-entry on three isolated nodes
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: modern-network-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'module' }}
  cancel-in-progress: true

jobs:
  founding-genesis:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'founding-genesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Verify the dependency graph and commission boundaries
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly -p 2 -count=1 -v -timeout 6m \
            -run '^Test(NativeConsensusValidatesGenesisSnapshot|ValidateNativeValidatorRegistrationProposal|BuildNativeValidatorRegistrationMetadata|NativeValidatorRegistrationProof.*|ValidatorRegistrationMetadataCommand|ValidatorControlMetadataBoundaries)$' \
            ./app ./cmd/mcnd
      - name: Verify founder-owned backing and commission changes with the real EVM
        run: |
          set -euo pipefail
          go test -mod=readonly -p 2 -count=1 -v -timeout 10m -tags appstate \
            -run '^TestOwnedApp(NativeLaunchPreview|NativeValidatorSelfControls)$' ./systemcontracts
      - name: Replay the prepared founding ledger and attest the cold genesis
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "$RUNNER_TEMP/founding-ledger.XXXXXXXX")"
          mkdir -m 700 "$root/source" "$root/replay"
          export MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$root/source"
          export MCND_NATIVE_LAUNCH_REHEARSAL=4-empty-sponsored
          go test -mod=readonly -p 2 -count=1 -v -timeout 5m -tags appstate \
            -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts
          python3 -B tools/test_founding_ledger_fixture.py --source "$root/source" --output "$root/ledger.json"
          export MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$root/replay"
          MCND_FOUNDING_LEDGER_FILE="$root/ledger.json" go test -mod=readonly -p 2 -count=1 -v -timeout 5m -tags appstate \
            -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts
          MCND_NATIVE_LAUNCH_VERIFY=1 go test -mod=readonly -p 2 -count=1 -v -timeout 5m -tags appstate \
            -run '^TestOwnedAppNativeLaunchPreview$' ./systemcontracts
          MCND_FOUNDING_LEDGER_SOURCE="$root/source" MCND_FOUNDING_LEDGER_FIXTURE="$root/replay" \
            python3 -B -m unittest discover -s tools -p 'test_founding_ledger_fixture.py' -v
          printf 'FOUNDING_WORKDIR=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Assemble and verify an unsigned candidate with the offline command
        run: |
          set -euo pipefail
          umask 077
          root="$FOUNDING_WORKDIR"
          mkdir -m 700 -p "$root/assembled/public"
          go build -mod=readonly -p 2 -trimpath -o "$root/mcnd-genesis" ./cmd/mcnd-genesis
          "$root/mcnd-genesis" addresses --chain-id mintcandy_990014-1 --evm-chain-id 990014 > "$root/roles.json"
          python3 -B tools/test_founding_ledger_fixture.py --source "$root/source" --roles "$root/roles.json" --output "$root/assembly-ledger.json"
          common=(--ledger "$root/assembly-ledger.json" --parameters tools/fixtures/founding-genesis-ci-parameters.json)
          genesis="$root/assembled/public/genesis.json"
          "$root/mcnd-genesis" build "${common[@]}" --genesis "$genesis"
          "$root/mcnd-genesis" build "${common[@]}" --genesis "$root/rebuilt.json"
          cmp "$genesis" "$root/rebuilt.json"
          if "$root/mcnd-genesis" build "${common[@]}" --genesis "$genesis"; then
            exit 1
          fi
          cmp "$genesis" "$root/rebuilt.json"
          "$root/mcnd-genesis" verify "${common[@]}" --genesis "$genesis" > "$root/cold.json"
          "$root/mcnd-genesis" verify "${common[@]}" --genesis "$genesis" > "$root/cold-replay.json"
          cmp "$root/cold.json" "$root/cold-replay.json"
          jq -e --arg sha "$(sha256sum "$genesis" | cut -d' ' -f1)" \
            '.status == "CANDIDATE_INIT_CHAIN_VERIFIED" and .chainId == "mintcandy_990014-1" and
            .genesisSha256 == $sha and (.firstBlockAppHash | test("^[0-9a-f]{64}$")) and
            .validators == 4 and .votingPower == 40000 and .bankBalances == 8 and
            .initialSupplyAtoms == "5041000000000000000000000" and .publicGenesisApproved == false' "$root/cold.json"
          jq '.app_state.gov.params.min_deposit[0].amount = "1"' "$genesis" > "$root/changed.json"
          if "$root/mcnd-genesis" verify "${common[@]}" --genesis "$root/changed.json"; then
            exit 1
          fi
          MCND_FOUNDING_LEDGER_SOURCE="$root/source" MCND_FOUNDING_LEDGER_FIXTURE="$root/assembled" MCND_FOUNDING_LEDGER_ROLES="$root/roles.json" \
            python3 -B -m unittest discover -s tools -p 'test_founding_ledger_fixture.py' -v

  modern-module:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'module'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Validate reusable remote-worker setup and checks
        if: github.event_name == 'workflow_dispatch' && inputs.remote_profile != 'off'
        working-directory: .
        env:
          REMOTE_PROFILE: ${{ inputs.remote_profile }}
        run: |
          export MCND_REMOTE_BASE="$RUNNER_TEMP/mintcandy-remote"
          bash scripts/remote/prepare.sh modern
          bash scripts/remote/validate.sh "$REMOTE_PROFILE"
          echo "GOMODCACHE=$MCND_REMOTE_BASE/modules" >> "$GITHUB_ENV"
          echo "GOCACHE=$MCND_REMOTE_BASE/cache/go1.26.11" >> "$GITHUB_ENV"
      - name: Verify independent dependency graph
        run: |
          mkdir -p validation-logs
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH CGO_ENABLED CC
            gcc --version
          } > validation-logs/environment.log
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify |& tee validation-logs/module-integrity.log
      - name: Verify owned sources and integrity guards
        run: |
          python3 scripts/verify_owned_evm.py |& tee validation-logs/owned-evm-integrity.log
          python3 scripts/verify_owned_geth.py |& tee validation-logs/owned-geth-integrity.log
          python3 scripts/verify_owned_sdk.py --compiled |& tee validation-logs/owned-sdk-integrity.log
          python3 scripts/verify_pion_transport.py |& tee validation-logs/pion-upstream-integrity.log
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_native_consensus_rewards.py'
          python3 -m unittest discover -s tools -p 'test_native_reward_checkpoint.py'
          python3 -m unittest discover -s tools -p 'test_reserve_fee_smoke.py'
      - name: Test ordinary crypto regressions with and without CGO
        run: |
          go test -mod=readonly -p 2 -count=1 github.com/ethereum/go-ethereum/crypto github.com/ethereum/go-ethereum/crypto/secp256k1 github.com/ethereum/go-ethereum/common/math |& tee validation-logs/geth-crypto-cgo.log
          CGO_ENABLED=0 go test -mod=readonly -p 2 -count=1 -run '^TestOwnedGeth' ./securitytests |& tee validation-logs/geth-crypto-nocgo.log
      - name: Test modern module and native feature port
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 10m ./... |& tee validation-logs/tests.log
      - name: Test declared SDK armor, keyring and signature compatibility
        run: |
          go test -mod=readonly -p 2 -count=1 -timeout 10m github.com/cosmos/cosmos-sdk/crypto/internal/armorcompat github.com/cosmos/cosmos-sdk/crypto github.com/cosmos/cosmos-sdk/crypto/keyring github.com/cosmos/cosmos-sdk/crypto/keys/secp256k1 github.com/cosmos/cosmos-sdk/crypto/keys/ed25519 |& tee validation-logs/sdk-crypto-keyring.log
          CGO_ENABLED=0 go test -mod=readonly -p 2 -count=1 -timeout 10m github.com/cosmos/cosmos-sdk/crypto/keys/secp256k1 github.com/cosmos/cosmos-sdk/crypto/keys/ed25519 |& tee validation-logs/sdk-signatures-nocgo.log
      - name: Reproduce pinned system contract artifacts
        run: |
          SOLC="$RUNNER_TEMP/solc-0.8.20"
          curl --fail --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.20+commit.a1b79de6' --output "$SOLC"
          echo "0479d44fdf9c501c25337fdc540419f1593b884a87b47f023da4f1c700fda782  $SOLC" | sha256sum --check
          chmod 755 "$SOLC"
          SOLC="$SOLC" python3 systemcontracts/build.py |& tee validation-logs/system-contract-reproduction.log
          SOLC="$SOLC" python3 systemcontracts/build_owned_delegation.py |& tee validation-logs/owned-delegation-reproduction.log
          git diff --exit-code -- systemcontracts/artifacts
      - name: Test native ownership against actual SDK governance tally
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 10m -tags sdk53 ./decimal/validator/governance |& tee validation-logs/native-governance-tally.log
      - name: Test owned ICS20 and the IBC client upgrade with a pending packet
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 10m -tags test -run '^TestOwnApplication(ICS20TwoChains|IBCClientUpgradePendingPacket)$' ./app |& tee validation-logs/ics20-unit.log
      - name: Build and execute memory-only family probe
        run: |
          go build -mod=readonly -p 2 -trimpath -o "$RUNNER_TEMP/family-check" ./cmd/family-check
          go version -m "$RUNNER_TEMP/family-check" > validation-logs/family-check-build.log
          sha256sum "$RUNNER_TEMP/family-check" >> validation-logs/family-check-build.log
          "$RUNNER_TEMP/family-check" |& tee validation-logs/family-check.log
      - name: Test security capture evidence
        working-directory: .
        run: python3 -m unittest discover -s scripts/audit -p "test_*.py"
      - name: Test external relayer lab guards
        working-directory: .
        run: python3 -m unittest discover -s network/internal/ibclab -p "test_*.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: modern-network-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            network/validation-logs/
            ${{ runner.temp }}/mintcandy-remote/results/
          retention-days: 30
          if-no-files-found: warn

  bridge-finality:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'bridge-finality'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Install pinned compiler for the isolated London escrow tests
        shell: bash
        run: |
          SOLC="$RUNNER_TEMP/solc-bridge-0.8.20"
          curl --fail --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.20+commit.a1b79de6' --output "$SOLC"
          echo "0479d44fdf9c501c25337fdc540419f1593b884a87b47f023da4f1c700fda782  $SOLC" | sha256sum --check
          chmod 755 "$SOLC"
          echo "MCND_BRIDGE_SOLC=$SOLC" >> "$GITHUB_ENV"
      - name: Test persistent bridge accounting, proofs and London EVM escrow
        working-directory: network
        shell: bash
        run: |
          mkdir -p validation-logs
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly -p 2 -tags 'bridgecontracts sp1contracts' -count=1 -v -timeout 8m ./bridge/... ./tools/comet_commit_probe |& tee validation-logs/bridge-finality.log
      - name: Test offline liveness diagnostics and recovery guardrails
        run: |
          python3 -B -m unittest discover -s network/tools -p 'test_consensus_health.py'
          python3 -B -m unittest discover -s network/tools -p 'test_quorum_recovery.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bridge-finality-${{ github.sha }}-${{ github.run_attempt }}
          path: network/validation-logs/bridge-finality.log
          retention-days: 14
          if-no-files-found: warn

  token-features:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'token-features'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      CC: gcc
    defaults:
      run:
        shell: bash
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Verify the independent dependency graph
        run: |
          mkdir -p validation-logs
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Test explicit DRC20 fee authorizations
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 5m ./fees/... |& tee validation-logs/token-fee-authorization.log
      - name: Test asset admission, grace period and validator control CLI
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 5m ./app ./cmd/mcnd ./decimal/nft/keeper ./decimal/validator/keeper ./decimal/validator/settlement |& tee validation-logs/user-assets-controls-unit.log
      - name: Test empty genesis and signed public token and NFT creation with restart
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 15m -tags appstate -run '^TestOwnedAppEmptyUserAssetsLifecycle$' ./systemcontracts |& tee validation-logs/empty-user-assets.log
      - name: Test signed public NFT admission and restart
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 12m -tags appstate -run '^TestOwnedAppNativeUserNFTLifecycle$' ./systemcontracts |& tee validation-logs/public-user-nft.log
      - name: Test grace expiry and old evidence across process restart
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 12m -tags appstate -run '^TestOwnedAppNativeTestGrace(Lifecycle|DowntimeLifecycle)$' ./systemcontracts |& tee validation-logs/native-test-grace.log
      - name: Test signed validator self controls, foreign operators and nonce replay
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 12m -tags appstate -run '^TestOwnedAppNativeValidatorSelfControls$' ./systemcontracts |& tee validation-logs/native-validator-controls.log
      - name: Test signed reserveless token lifecycle and disk restart
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 12m -tags appstate -run '^TestOwnedAppNativeReservelessTokenLifecycle$' ./systemcontracts |& tee validation-logs/reserveless-native.log
      - name: Test factory collection and NFT metadata pointer round trips
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 8m -run '^TestOwnedAppSignedRegistryBootstrap$/^atomic_constructor_handoff_to_governance$/^fresh_factory_creation_and_mint$' ./systemcontracts |& tee validation-logs/nft-metadata.log
      - name: Test Ethereum receipts with separate DRC20 conversion fees
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 5m -run 'Test(ParseTxResult|MintCandyReserveFee|ReserveFeeReceipts|ReceiptsFromCometBlock)' github.com/cosmos/evm/rpc/types github.com/cosmos/evm/rpc/backend |& tee validation-logs/reserve-fee-rpc.log
      - name: Test composite fee envelope mempool routing
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 5m github.com/cosmos/evm/mempool |& tee validation-logs/reserve-fee-mempool.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: token-features-${{ github.sha }}-${{ github.run_attempt }}
          path: network/validation-logs/
          retention-days: 14
          if-no-files-found: warn

  token-daemon:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'token-daemon'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOTOOLCHAIN: local
      GOAMD64: 'v1'
      CGO_ENABLED: '1'
      CC: gcc
      GOMAXPROCS: '2'
    defaults:
      run:
        shell: bash
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Build default daemon before creating disposable fixtures
        run: |
          mkdir -p validation-logs
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go build -mod=readonly -tags= -buildvcs=true -p 2 -trimpath -ldflags "-X main.buildCommit=$GITHUB_SHA" -o "$RUNNER_TEMP/mcnd-fee" ./cmd/mcnd
          go version -m "$RUNNER_TEMP/mcnd-fee" > validation-logs/fee-daemon-build.log
          sha256sum "$RUNNER_TEMP/mcnd-fee" >> validation-logs/fee-daemon-build.log
      - name: Export canonical custom-token and zero-native-balance payer fixtures
        run: |
          install -d -m 700 "$RUNNER_TEMP/fee-fixture" "$RUNNER_TEMP/fee-homes"
          MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$RUNNER_TEMP/fee-fixture" MCND_NATIVE_HISTORICAL_CONSENSUS_PHASE=seed MCND_NATIVE_DRC20_GENESIS_PHASE=seed go test -mod=readonly -p 2 -count=1 -v -timeout 8m -tags appstate -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts |& tee validation-logs/fee-daemon-seed.log
          MCND_DRC20_FEE_DAEMON_FIXTURE="$RUNNER_TEMP/fee-fixture" go test -mod=readonly -p 2 -count=1 -v -timeout 5m -tags appstate -run '^TestExportDRC20FeeDaemonFixture$' ./systemcontracts |& tee validation-logs/fee-daemon-fixture.log
      - name: Test live API, envelope broadcast, EVM revert and restart in isolated loopback network
        run: |
          binary_sha="$(sha256sum "$RUNNER_TEMP/mcnd-fee" | awk '{print $1}')"
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            python3 "$GITHUB_WORKSPACE/network/tools/reserve_fee_smoke.py" \
            --binary "$RUNNER_TEMP/mcnd-fee" --binary-sha256 "$binary_sha" --source-commit "$GITHUB_SHA" \
            --fixture "$RUNNER_TEMP/fee-fixture" --home-parent "$RUNNER_TEMP/fee-homes" \
            --report "$GITHUB_WORKSPACE/network/validation-logs/fee-daemon.json" |& tee validation-logs/fee-daemon.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: token-daemon-${{ github.sha }}-${{ github.run_attempt }}
          path: network/validation-logs/
          retention-days: 14
          if-no-files-found: warn

  mass-delegation:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'mass-delegation' || inputs.scope == 'mass-delegation-release')
    runs-on: ${{ inputs.scope == 'mass-delegation-release' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    timeout-minutes: 65
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      MCND_MASS_DELEGATION_COUNTS: '10,100,1000'
      MASS_TEST_SOURCE: ${{ inputs.scope == 'mass-delegation-release' && '3880898bf95fe701b9d6f28d6e029a63f88a16ae' || github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.MASS_TEST_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Verify dependency graph and source revision
        run: |
          mkdir -p validation-logs
          test "$(git rev-parse HEAD)" = "$MASS_TEST_SOURCE"
          git rev-parse HEAD | tee validation-logs/revision.log
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Test mass delegation and durable penalties with actual EVM
        if: inputs.scope == 'mass-delegation'
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 55m -run '^TestOwnedAppNativeMassDelegationLifecycle$' ./systemcontracts |& tee validation-logs/mass-delegation-evm.log
      - name: Measure the release-source App and EVM under fixed runner limits
        if: inputs.scope == 'mass-delegation-release'
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/mcnd-mass-resource.XXXXXXXX")
          mkdir -m 700 "$work/tmp"
          go test -mod=readonly -p 2 -c -o "$work/systemcontracts.test" ./systemcontracts
          printf 'source=%s\nworkflow=%s\n' "$MASS_TEST_SOURCE" "$GITHUB_SHA" > validation-logs/mass-resource-runner.txt
          uname -r >> validation-logs/mass-resource-runner.txt
          for count in 10 100 1000; do
            sudo -n systemd-run --quiet --wait --collect --pipe --service-type=exec --expand-environment=no \
              --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD/systemcontracts" \
              --property=PrivateNetwork=yes --property=MemoryMax=2G --property=MemorySwapMax=0 --property=CPUQuota=200% \
              --setenv=GOMAXPROCS=2 --setenv="TMPDIR=$work/tmp" --setenv="MCND_MASS_DELEGATION_COUNTS=$count" \
              /bin/bash -euc '
                cgroup=$(sed -n "s/^0:://p" /proc/self/cgroup)
                test -n "$cgroup"
                group=/sys/fs/cgroup"$cgroup"
                test "$(cat "$group/memory.max")" = 2147483648
                test "$(cat "$group/memory.swap.max")" = 0
                read -r quota period < "$group/cpu.max"
                test "$quota" -eq "$((2 * period))"
                printf "positions=%s\nmemoryMaxBytes=2147483648\nmaxCpuCores=2\n" "$MCND_MASS_DELEGATION_COUNTS"
                /usr/bin/time -f "elapsedSeconds=%e\nuserCpuSeconds=%U\nsystemCpuSeconds=%S\nmaxProcessRssKiB=%M" \
                  "$1" -test.count=1 -test.v -test.timeout=20m -test.run="^TestOwnedAppNativeMassDelegationLifecycle\$"
                printf "cgroupMemoryPeakBytes=%s\n" "$(cat "$group/memory.peak")"
                cat "$group/memory.events"
                grep -qx "oom_kill 0" "$group/memory.events"
              ' _ "$work/systemcontracts.test" |& tee "validation-logs/mass-resource-$count.log"
            grep -Fq "actual EVM mass penalty lifecycle passed: positions=$count," "validation-logs/mass-resource-$count.log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mass-delegation-${{ github.sha }}-${{ github.run_attempt }}
          path: network/validation-logs/
          retention-days: 14
          if-no-files-found: warn

  contract-artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'contracts'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Regenerate exact pinned contract artifacts
        shell: bash
        run: bash scripts/remote/generate-contracts.sh "$RUNNER_TEMP/contract-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: regenerated-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/contract-output/
          retention-days: 7
          if-no-files-found: error

  isolated-process-gates:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'process' || inputs.scope == 'held-downtime' || inputs.scope == 'native-upgrade-governance' || inputs.scope == 'nft-downtime' || inputs.scope == 'native-full-profile-upgrade' || inputs.scope == 'native-full-ibc-upgrade' || inputs.scope == 'native-cross-version-ibc-upgrade' || inputs.scope == 'native-systemd-module-upgrade' || inputs.scope == 'native-systemd-four-validator-recovery' || inputs.scope == 'native-systemd-startup-replay')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOTOOLCHAIN: local
      GOAMD64: 'v1'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ inputs.scope == 'native-cross-version-ibc-upgrade' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Build default binaries and run isolated process gates
        shell: bash
        env:
          WITHDRAWAL_GENESIS: ${{ inputs.withdrawal_genesis }}
          DEL_STATE_SYNC: ${{ inputs.del_state_sync }}
          IBC_CLIENT_UPGRADE: ${{ inputs.ibc_client_upgrade }}
          NATIVE_CONSENSUS: ${{ inputs.native_consensus }}
          NATIVE_FEE_REWARDS: ${{ inputs.native_fee_rewards }}
          NATIVE_IBC_V1: ${{ inputs.native_ibc_v1 }}
          NATIVE_DEL_DOWNTIME: ${{ inputs.native_del_downtime }}
          NATIVE_DEL_JAIL_RECOVERY: ${{ inputs.native_del_jail_recovery }}
          VALIDATION_SCOPE: ${{ inputs.scope }}
        run: |
          args=("$RUNNER_TEMP/process-evidence" off off off off off off off off off off)
          if [[ "$DEL_STATE_SYNC" == true ]]; then
            args[1]=withdrawal-genesis
            args[2]=del-state-sync
          elif [[ "$WITHDRAWAL_GENESIS" == true ]]; then
            args[1]=withdrawal-genesis
          fi
          if [[ "$IBC_CLIENT_UPGRADE" == true ]]; then
            args[3]=ibc-client-upgrade
          fi
          if [[ "$NATIVE_FEE_REWARDS" == true ]]; then
            args[4]=native-consensus-fee-rewards
          elif [[ "$NATIVE_CONSENSUS" == true ]]; then
            args[4]=native-consensus
          fi
          if [[ "$NATIVE_IBC_V1" == true ]]; then
            args[5]=native-ibc-v1
          fi
          if [[ "$NATIVE_DEL_DOWNTIME" == true ]]; then
            args[6]=native-del-downtime
          fi
          if [[ "$NATIVE_DEL_JAIL_RECOVERY" == true ]]; then
            args[7]=native-del-jail-recovery
          fi
          if [[ "$VALIDATION_SCOPE" == held-downtime ]]; then
            args[8]=native-held-del-downtime
          elif [[ "$VALIDATION_SCOPE" == native-upgrade-governance ]]; then
            args[9]=native-upgrade-governance
          elif [[ "$VALIDATION_SCOPE" == native-full-profile-upgrade || "$VALIDATION_SCOPE" == native-full-ibc-upgrade || "$VALIDATION_SCOPE" == native-cross-version-ibc-upgrade || "$VALIDATION_SCOPE" == native-systemd-module-upgrade || "$VALIDATION_SCOPE" == native-systemd-four-validator-recovery || "$VALIDATION_SCOPE" == native-systemd-startup-replay ]]; then
            args[9]="$VALIDATION_SCOPE"
          elif [[ "$VALIDATION_SCOPE" == nft-downtime ]]; then
            args[10]=native-nft-downtime
          fi
          bash scripts/remote/process-gates.sh "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: process-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-evidence/
          retention-days: 7
          if-no-files-found: warn
