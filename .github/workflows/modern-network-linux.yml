name: Modern network validation

on:
  push:
    branches: ['integration/**', 'network/**', 'release/**']
    paths: ['network/**', 'scripts/audit/**', '.github/workflows/modern-network-linux.yml']
  pull_request:
    paths: ['network/**', 'scripts/audit/**', '.github/workflows/modern-network-linux.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Module tests, contract generation, or isolated daemon and Hermes
        default: module
        type: choice
        options: [module, contracts, process]
      remote_profile:
        description: Also validate the reusable remote-worker scripts
        default: 'off'
        type: choice
        options: ['off', modern-smoke, modern-full]
      withdrawal_genesis:
        description: Also boot the private authenticated NFT withdrawal and DEL delegation genesis fixtures
        default: false
        type: boolean
      del_state_sync:
        description: Also restore the DEL fixture over isolated P2P and verify replay
        default: false
        type: boolean
      ibc_client_upgrade:
        description: Also rehearse a same-family daemon replacement and proof-based Hermes client upgrade
        default: false
        type: boolean
      native_consensus:
        description: Also check a signed native consensus transition on three isolated mcnd nodes
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: modern-network-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'module' }}
  cancel-in-progress: true

jobs:
  modern-module:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'module'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Validate reusable remote-worker setup and checks
        if: github.event_name == 'workflow_dispatch' && inputs.remote_profile != 'off'
        working-directory: .
        env:
          REMOTE_PROFILE: ${{ inputs.remote_profile }}
        run: |
          export MCND_REMOTE_BASE="$RUNNER_TEMP/mintcandy-remote"
          bash scripts/remote/prepare.sh modern
          bash scripts/remote/validate.sh "$REMOTE_PROFILE"
          echo "GOMODCACHE=$MCND_REMOTE_BASE/modules" >> "$GITHUB_ENV"
          echo "GOCACHE=$MCND_REMOTE_BASE/cache/go1.26.11" >> "$GITHUB_ENV"
      - name: Verify independent dependency graph
        run: |
          mkdir -p validation-logs
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH CGO_ENABLED CC
            gcc --version
          } > validation-logs/environment.log
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify |& tee validation-logs/module-integrity.log
      - name: Verify owned sources and integrity guards
        run: |
          python3 scripts/verify_owned_evm.py |& tee validation-logs/owned-evm-integrity.log
          python3 scripts/verify_owned_geth.py |& tee validation-logs/owned-geth-integrity.log
          python3 scripts/verify_owned_sdk.py --compiled |& tee validation-logs/owned-sdk-integrity.log
          python3 scripts/verify_pion_transport.py |& tee validation-logs/pion-upstream-integrity.log
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test ordinary crypto regressions with and without CGO
        run: |
          go test -mod=readonly -p 2 -count=1 github.com/ethereum/go-ethereum/crypto github.com/ethereum/go-ethereum/crypto/secp256k1 github.com/ethereum/go-ethereum/common/math |& tee validation-logs/geth-crypto-cgo.log
          CGO_ENABLED=0 go test -mod=readonly -p 2 -count=1 -run '^TestOwnedGeth' ./securitytests |& tee validation-logs/geth-crypto-nocgo.log
      - name: Test modern module and native feature port
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 10m ./... |& tee validation-logs/tests.log
      - name: Test declared SDK armor, keyring and signature compatibility
        run: |
          go test -mod=readonly -p 2 -count=1 -timeout 10m github.com/cosmos/cosmos-sdk/crypto/internal/armorcompat github.com/cosmos/cosmos-sdk/crypto github.com/cosmos/cosmos-sdk/crypto/keyring github.com/cosmos/cosmos-sdk/crypto/keys/secp256k1 github.com/cosmos/cosmos-sdk/crypto/keys/ed25519 |& tee validation-logs/sdk-crypto-keyring.log
          CGO_ENABLED=0 go test -mod=readonly -p 2 -count=1 -timeout 10m github.com/cosmos/cosmos-sdk/crypto/keys/secp256k1 github.com/cosmos/cosmos-sdk/crypto/keys/ed25519 |& tee validation-logs/sdk-signatures-nocgo.log
      - name: Reproduce pinned system contract artifacts
        run: |
          SOLC="$RUNNER_TEMP/solc-0.8.20"
          curl --fail --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.20+commit.a1b79de6' --output "$SOLC"
          echo "0479d44fdf9c501c25337fdc540419f1593b884a87b47f023da4f1c700fda782  $SOLC" | sha256sum --check
          chmod 755 "$SOLC"
          SOLC="$SOLC" python3 systemcontracts/build.py |& tee validation-logs/system-contract-reproduction.log
          SOLC="$SOLC" python3 systemcontracts/build_owned_delegation.py |& tee validation-logs/owned-delegation-reproduction.log
          git diff --exit-code -- systemcontracts/artifacts
      - name: Test native ownership against actual SDK governance tally
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 10m -tags sdk53 ./decimal/validator/governance |& tee validation-logs/native-governance-tally.log
      - name: Test owned ICS20 and the IBC client upgrade with a pending packet
        run: go test -mod=readonly -p 2 -count=1 -v -timeout 10m -tags test -run '^TestOwnApplication(ICS20TwoChains|IBCClientUpgradePendingPacket)$' ./app |& tee validation-logs/ics20-unit.log
      - name: Build and execute memory-only family probe
        run: |
          go build -mod=readonly -p 2 -trimpath -o "$RUNNER_TEMP/family-check" ./cmd/family-check
          go version -m "$RUNNER_TEMP/family-check" > validation-logs/family-check-build.log
          sha256sum "$RUNNER_TEMP/family-check" >> validation-logs/family-check-build.log
          "$RUNNER_TEMP/family-check" |& tee validation-logs/family-check.log
      - name: Test security capture evidence
        working-directory: .
        run: python3 -m unittest discover -s scripts/audit -p "test_*.py"
      - name: Test external relayer lab guards
        working-directory: .
        run: python3 -m unittest discover -s network/internal/ibclab -p "test_*.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: modern-network-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            network/validation-logs/
            ${{ runner.temp }}/mintcandy-remote/results/
          retention-days: 30
          if-no-files-found: warn

  contract-artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'contracts'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Regenerate exact pinned contract artifacts
        shell: bash
        run: bash scripts/remote/generate-contracts.sh "$RUNNER_TEMP/contract-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: regenerated-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/contract-output/
          retention-days: 7
          if-no-files-found: error

  isolated-process-gates:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'process'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOTOOLCHAIN: local
      GOAMD64: 'v1'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Build default binaries and run isolated process gates
        shell: bash
        env:
          WITHDRAWAL_GENESIS: ${{ inputs.withdrawal_genesis }}
          DEL_STATE_SYNC: ${{ inputs.del_state_sync }}
          IBC_CLIENT_UPGRADE: ${{ inputs.ibc_client_upgrade }}
          NATIVE_CONSENSUS: ${{ inputs.native_consensus }}
        run: |
          args=("$RUNNER_TEMP/process-evidence" off off off off)
          if [[ "$DEL_STATE_SYNC" == true ]]; then
            args[1]=withdrawal-genesis
            args[2]=del-state-sync
          elif [[ "$WITHDRAWAL_GENESIS" == true ]]; then
            args[1]=withdrawal-genesis
          fi
          if [[ "$IBC_CLIENT_UPGRADE" == true ]]; then
            args[3]=ibc-client-upgrade
          fi
          if [[ "$NATIVE_CONSENSUS" == true ]]; then
            args[4]=native-consensus
          fi
          bash scripts/remote/process-gates.sh "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: process-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/process-evidence/
          retention-days: 7
          if-no-files-found: warn
