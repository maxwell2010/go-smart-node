name: MintCandy native profile rehearsal

on:
  push:
    branches: ['codex/mintcandy-native-denoms', 'integration/mintcandy-native-denoms', 'integration/mintcandy-mainnet*']
    paths: ['network/**', '.github/workflows/mintcandy-native-profiles.yml']
  workflow_dispatch:
    inputs:
      published_ibc:
        description: Rehearse Hermes with the published MSP daemon and disposable validators
        type: boolean
        default: false
      published_node:
        description: Rehearse systemd restart, snapshot sync and pruning with the published MSP daemon
        type: boolean
        default: false
      testnet_package_run:
        description: Verify an attested tMSP package from a completed release build at this source revision
        type: string
      mainnet_package_run:
        description: Verify an attested MSP package from a completed release build at this source revision
        type: string
      msp_release_switch:
        description: Switch the isolated MSP validators from v1.2.0 to v1.2.1 and back with an ICS-20 packet pending
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mintcandy-native-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mainnet
            evm_id: '9905401'
            other_evm_id: '990098'
            denom: msp
            other_denom: tmsp
            symbol: MSP
            wrapper: WMSP
          - profile: testnet
            evm_id: '990098'
            other_evm_id: '9905401'
            denom: tmsp
            other_denom: msp
            symbol: tMSP
            wrapper: WtMSP
    defaults:
      run:
        shell: bash
        working-directory: network
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      PROFILE: ${{ matrix.profile }}
      EVM_ID: ${{ matrix.evm_id }}
      OTHER_EVM_ID: ${{ matrix.other_evm_id }}
      DENOM: ${{ matrix.denom }}
      OTHER_DENOM: ${{ matrix.other_denom }}
      SYMBOL: ${{ matrix.symbol }}
      WRAPPER: ${{ matrix.wrapper }}
      MSP_RELEASE_SWITCH: ${{ inputs.msp_release_switch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Validate dependencies and offline tooling
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          python3 scripts/verify_owned_evm.py
          python3 scripts/verify_owned_geth.py
          python3 scripts/verify_owned_sdk.py --compiled
          python3 -B -m unittest test_check_operator_applications test_public_genesis_manifest \
            test_install_validator_genesis test_native_launch_package
        env:
          PYTHONPATH: tools
      - name: Build the profile and verify isolated genesis
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/mc.XXXXXX")
          printf 'PROFILE_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          mkdir -m 700 -p "$work/fixture" "$work/assembled/public" "$work/evidence"
          tags="mintcandy_$PROFILE"
          chain="mintcandy_${EVM_ID}-1"
          go build -mod=readonly -p 2 -tags "$tags" -trimpath \
            -ldflags "-X main.buildCommit=$GITHUB_SHA" -o "$work/mcnd" ./cmd/mcnd
          go build -mod=readonly -p 2 -tags "$tags" -trimpath -o "$work/mcnd-genesis" ./cmd/mcnd-genesis
          go build -mod=readonly -p 2 -tags "$tags" -trimpath -o "$work/comet-commit-probe" ./tools/comet_commit_probe
          go test -mod=readonly -p 2 -tags "$tags" -count=1 -timeout 2m -run '^TestVerifiedQuorum$' ./tools/comet_commit_probe
          go test -mod=readonly -p 2 -tags "$tags" -count=1 -timeout 2m -json \
            -run '^TestCompiledNativeProfile$' ./identity | tee "$work/evidence/compiled-profile.jsonl"
          jq -s -e 'any(.[]; .Action == "pass" and .Test == "TestCompiledNativeProfile")' \
            "$work/evidence/compiled-profile.jsonl" >/dev/null
          if [[ "$PROFILE" == mainnet ]]; then
            go test -mod=readonly -p 2 -tags "$tags" -count=1 -timeout 4m -json \
              -run '^TestMainnetICS20DenomAdmission$' ./app | tee "$work/evidence/ics20-admission.jsonl"
            jq -s -e 'any(.[]; .Action == "pass" and .Test == "TestMainnetICS20DenomAdmission")' \
              "$work/evidence/ics20-admission.jsonl" >/dev/null
          fi
          # Generate disposable signing identities through the existing sponsored CI fixture.
          export MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$work/fixture"
          export MCND_NATIVE_LAUNCH_REHEARSAL=4-empty-sponsored
          if ! go test -mod=readonly -p 2 -count=1 -timeout 8m -json \
            -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts \
            > "$work/fixture.log" 2>&1; then
            sed -nE 's/.*([ /])(native_(consensus|launch)[[:alnum:]_]*\.go:[0-9]+).*/\2/p' "$work/fixture.log" | sort -u
            exit 1
          fi
          "$work/mcnd-genesis" addresses --chain-id "$chain" --evm-chain-id "$EVM_ID" > "$work/roles.json"
          python3 -B tools/test_founding_ledger_fixture.py --source "$work/fixture" --roles "$work/roles.json" \
            --network-profile "$PROFILE" --output "$work/ledger.json"
          genesis="$work/assembled/public/genesis.json"
          options=(--ledger "$work/ledger.json" --parameters tools/fixtures/founding-genesis-ci-parameters.json)
          "$work/mcnd-genesis" build "${options[@]}" --genesis "$genesis"
          "$work/mcnd-genesis" build "${options[@]}" --genesis "$work/rebuilt.json"
          cmp "$genesis" "$work/rebuilt.json"
          "$work/mcnd-genesis" verify "${options[@]}" --genesis "$genesis" > "$work/evidence/assembly.json"
          jq -e --arg wrapper "$WRAPPER" --arg chain "$chain" --arg evm "$EVM_ID" --arg denom "$DENOM" \
            '.status == "CANDIDATE_INIT_CHAIN_VERIFIED" and .chainId == $chain and .evmChainId == $evm and
             .nativeDenom == $denom and .wrappedTokenSymbol == $wrapper and .validators == 4 and .votingPower == 40000 and
             .publicGenesisApproved == false' "$work/evidence/assembly.json" >/dev/null
          jq -e --arg denom "$DENOM" --arg symbol "$SYMBOL" \
            '.app_state.bank.denom_metadata | any(.base == $denom and .symbol == $symbol and .display == $symbol)' \
            "$genesis" >/dev/null
          jq --arg foreign "$OTHER_DENOM" '.app_state.evm.params.evm_denom = $foreign' "$genesis" > "$work/foreign.json"
          if "$work/mcnd-genesis" verify "${options[@]}" --genesis "$work/foreign.json"; then
            echo 'Cold verification unexpectedly accepted a different EVM denomination.' >&2
            exit 1
          fi
          install -m 600 "$genesis" "$work/assembled/genesis.json"
          install -m 600 "$work/fixture/"priv_validator_key_{a,b,c,d}.json "$work/assembled/"
          jq --arg chain "$chain" --argjson evm "$EVM_ID" '{chainId: $chain, evmChainId: $evm, actor, actorNative,
            validators: [.validators[] | {name, initialPower, consensusAddress, publicKey}]}' \
            "$work/fixture/expectations.json" > "$work/assembled/expectations.json"
          MCND_FOUNDING_LEDGER_SOURCE="$work/fixture" MCND_FOUNDING_LEDGER_FIXTURE="$work/assembled" \
            MCND_FOUNDING_LEDGER_ROLES="$work/roles.json" MCND_FOUNDING_NETWORK_PROFILE="$PROFILE" \
            python3 -B -m unittest discover -s tools -p test_founding_ledger_fixture.py
      - name: Sign and verify a test archive with a disposable key
        run: |
          set -euo pipefail
          umask 077
          work="$PROFILE_WORK"
          signer_home=$(mktemp -d "$work/g.XXXXXX")
          trap 'gpgconf --homedir "$signer_home" --kill all' EXIT
          gpg --homedir "$signer_home" --batch --no-tty --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'MintCandy native profile rehearsal' ed25519 sign 1d
          signer=$(gpg --homedir "$signer_home" --batch --with-colons --list-keys | awk -F: '$1 == "fpr" {print $10}')
          [[ "$signer" =~ ^[0-9A-F]{40}$ ]]
          gpg --homedir "$signer_home" --batch --export "$signer" > "$work/trusted.gpg"
          genesis="$work/assembled/public/genesis.json"
          archive="$work/mcnd-test.tar.gz"
          python3 -B tools/native_launch_package.py build --binary "$work/mcnd" --genesis "$genesis" \
            --source-commit "$GITHUB_SHA" --output "$archive" --signer-home "$signer_home" --signer-fingerprint "$signer"
          python3 -B tools/native_launch_package.py verify --archive "$archive" --trusted-keyring "$work/trusted.gpg" \
            --signer-fingerprint "$signer" --output-dir "$work/verified" > "$work/evidence/package.json"
          cmp "$work/mcnd" "$work/verified/bin/mcnd"
          cmp "$genesis" "$work/verified/genesis.json"
          jq --arg revision "$GITHUB_SHA" '{releaseVersion: "0.0.0", sourceRevision: $revision, binarySha256}' \
            "$work/evidence/package.json" > "$work/evidence/install.json"
          binary="$work/verified/bin/mcnd"
          "$binary" init retention-check --home "$work/retention" --chain-id "mintcandy_${EVM_ID}-1" \
            --evm.evm-chain-id "$EVM_ID" >/dev/null 2>&1
          python3 -B tools/configure_history.py --home "$work/retention" --apply --role rpc-ibc > "$work/evidence/retention.json"
      - name: Verify four-validator consensus and signed observer bootstrap
        run: |
          set -euo pipefail
          umask 077
          work="$PROFILE_WORK"
          printf '127.0.0.1 localhost peer-bootstrap.example.invalid\n' > "$work/hosts"
          binary="$work/verified/bin/mcnd"
          package="$work/evidence/package.json"
          report="$work/evidence/network.json"
          status=0
          sudo -n unshare --net --mount --propagation private -- bash -euc '
            ip link set lo up
            mount --bind "$1" /etc/hosts
            shift
            exec "$@"
          ' _ "$work/hosts" env TMPDIR="$work" "$(command -v python3)" -B "$PWD/tools/native_launch_rehearsal.py" \
            --binary "$binary" --binary-sha256 "$(jq -er .binarySha256 "$package")" \
            --archive-sha256 "$(jq -er .archiveSha256 "$package")" --source-commit "$GITHUB_SHA" \
            --fixture "$work/assembled" --home-parent "$work" --assembly-report "$work/evidence/assembly.json" \
            --report "$report" --network-profile "$PROFILE" --four-validators --empty-user-assets \
            --quorum-loss-recovery --signed-bootstrap --commit-probe "$work/comet-commit-probe" \
            --package-genesis "$work/verified/genesis.json" || status=$?
          if [[ -f "$report" ]]; then
            sudo -n chown "$(id -u):$(id -g)" "$report"
          fi
          (( status == 0 ))
          jq -e --arg denom "$DENOM" --arg symbol "$SYMBOL" --arg wrapper "$WRAPPER" \
            --arg genesis "$(jq -er .genesisSha256 "$package")" \
            '.status == "PASS" and .loopbackOnlyNamespace and .offlineAssembledGenesis and .followerVotingPower == 0 and
             .genesisSha256 == $genesis and .foundingCommitProof.status == "FOUNDING_COMMIT_VERIFIED" and
             .rpc.nativeDenom == $denom and .rpc.nativeSymbol == $symbol and .wrappedTokenSymbol == $wrapper and
             .quorumRecovery.verifiedEd25519Signatures == 3 and .fourSignerRecovery.verifiedEd25519Signatures == 4 and
             .signedBootstrap.appHash == .appHash and .signedBootstrap.outboundPeers == [.signedBootstrap.nodeId] and
             (.signedBootstrap.networkLaunchAuthorized | not)' "$report" >/dev/null
      - name: Install the published MSP release using the operator guide
        if: ((inputs.published_ibc || inputs.published_node) && !inputs.mainnet_package_run || inputs.msp_release_switch) && matrix.profile == 'mainnet' && github.repository == 'maxwell2010/go-smart-node'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACEMENT_RUN: ${{ inputs.mainnet_package_run }}
        run: |
          set -euo pipefail
          umask 077
          work="$PROFILE_WORK"
          release='https://github.com/maxwell2010/go-smart-node/releases/download/v1.2.0'
          source='fcfe88732af1b96315826f39a2b2bf04f9ef54f8'
          archive_sha='62a400e118178bb5b904d809a140c83fa100dee605db154e521ab51c1c4f308c'
          binary_sha='21179ad426df0d2ae1aaf87a6e08c22a91f6aad8924a513a7c3593f6ce81de94'
          destination="$work/published/mcnd"
          variable_prefix=PUBLISHED
          if [[ "$MSP_RELEASE_SWITCH" == true ]]; then
            [[ "$REPLACEMENT_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
            destination="$work/predecessor/mcnd"
            variable_prefix=PREDECESSOR
          fi
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            "https://raw.githubusercontent.com/maxwell2010/go-smart-node/$source/network/tools/install_software.py" \
            -o "$work/install_software.py"
          printf '%s  %s\n' a18b765cf2f2a384dc819642f8a0872a9bd85bbf12b4bac6edf75c62d3f0d3a1 \
            "$work/install_software.py" | sha256sum --check --strict
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            "$release/provenance.sigstore.json" -o "$work/provenance.sigstore.json"
          python3 -I -B "$work/install_software.py" --source-sha "$source" \
            --source-ref refs/heads/codex/mintcandy-native-denoms --release-version 1.2.0 --native-denom msp \
            --archive-sha "$archive_sha" --archive-url "$release/mcnd-1.2.0-linux-amd64.tar.gz" \
            --bundle "$work/provenance.sigstore.json" --destination "$destination" \
            > "$work/evidence/${variable_prefix,,}-install.json"
          printf '%s  %s\n' "$binary_sha" "$destination" | sha256sum --check --strict
          {
            printf '%s_SOURCE=%s\n' "$variable_prefix" "$source"
            printf '%s_ARCHIVE_SHA=%s\n' "$variable_prefix" "$archive_sha"
            printf '%s_BINARY_SHA=%s\n' "$variable_prefix" "$binary_sha"
          } >> "$GITHUB_ENV"
      - name: Install the attested release candidate and reject the other signing domain
        if: ((inputs.mainnet_package_run && matrix.profile == 'mainnet') || (inputs.testnet_package_run && matrix.profile == 'testnet')) && github.repository == 'maxwell2010/go-smart-node'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ (matrix.profile == 'testnet' && inputs.testnet_package_run) || inputs.mainnet_package_run }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PACKAGE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          work="$PROFILE_WORK"
          source="$GITHUB_SHA"
          branch="${GITHUB_REF#refs/heads/}"
          if [[ "$MSP_RELEASE_SWITCH" == true && "$PROFILE" == mainnet ]]; then
            source='b1a460046270399592773c845d00aef4b7277a9b'
            branch='codex/mintcandy-native-denoms'
            git fetch --no-tags --depth=1 origin "$source"
            git diff --exit-code "$source" "$GITHUB_SHA" -- network
          fi
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" | jq -er \
            --arg source "$source" --arg branch "$branch" --arg repo "$GITHUB_REPOSITORY" '
            select(.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and
              .head_sha == $source and .head_branch == $branch and .head_repository.full_name == $repo and
              .path == ".github/workflows/modern-network-development.yml") | .run_attempt')
          for kind in package attestation; do
            gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$work/software-archive" \
              --name "mcnd-software-$kind-$source-$attempt"
          done
          verification="$work/software-archive/software-verified.json"
          jq -e --arg source "$source" --arg denom "$DENOM" '
            .status == "software-release" and .sourceRevision == $source and
              .nativeDenom == $denom and .includesGenesis == false and .networkLaunchApproved == false
            ' "$verification" >/dev/null
          version=$(jq -er .releaseVersion "$verification")
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$MSP_RELEASE_SWITCH" == true && "$PROFILE" == mainnet ]]; then
            test "$version" = 1.2.1
          fi
          archive="$work/software-archive/mcnd-$version-linux-amd64.tar.gz"
          archive_sha=$(jq -er .archiveSha256 "$verification")
          binary_sha=$(jq -er .binarySha256 "$verification")
          python3 -I -B tools/install_software.py --source-sha "$source" \
            --source-ref "refs/heads/$branch" --release-version "$version" --native-denom "$DENOM" \
            --archive-sha "$archive_sha" --archive "$archive" --bundle "$work/software-archive/provenance.sigstore.json" \
            --destination "$work/published/mcnd" > "$work/evidence/published-install.json"
          printf '%s  %s\n' "$binary_sha" "$work/published/mcnd" | sha256sum --check --strict
          if "$work/published/mcnd" init wrong-profile --home "$work/wrong-profile" \
            --chain-id "mintcandy_${OTHER_EVM_ID}-1" --evm.evm-chain-id "$OTHER_EVM_ID" > "$work/wrong-profile.log" 2>&1; then
            echo 'The executable unexpectedly accepted the other signing domain.' >&2
            exit 1
          fi
          grep -F -- "$DENOM profile requires chain ID \"mintcandy_${EVM_ID}-1\"" "$work/wrong-profile.log"
          printf 'PUBLISHED_SOURCE=%s\nPUBLISHED_ARCHIVE_SHA=%s\nPUBLISHED_BINARY_SHA=%s\n' \
            "$source" "$archive_sha" "$binary_sha" >> "$GITHUB_ENV"
      - name: Verify systemd restart, snapshot sync and pruning with the versioned binary
        if: (((inputs.published_node || inputs.mainnet_package_run) && !inputs.msp_release_switch && matrix.profile == 'mainnet') || (inputs.testnet_package_run && matrix.profile == 'testnet')) && github.repository == 'maxwell2010/go-smart-node'
        run: |
          set -euo pipefail
          umask 077
          work="$PROFILE_WORK"
          report="$work/evidence/published-node.json"
          status=0
          sudo -n unshare --net -- bash -euc '
            ip link set lo up
            reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
            sysctl -qw "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}33656-33657"
            exec "$@"
          ' _ env TMPDIR="$work" "$(command -v python3)" -B "$PWD/tools/native_launch_rehearsal.py" \
            --binary "$work/published/mcnd" --binary-sha256 "$PUBLISHED_BINARY_SHA" \
            --archive-sha256 "$PUBLISHED_ARCHIVE_SHA" --source-commit "$PUBLISHED_SOURCE" \
            --fixture "$work/assembled" --home-parent "$work" --assembly-report "$work/evidence/assembly.json" \
            --report "$report" --network-profile "$PROFILE" --four-validators --empty-user-assets \
            --package-genesis "$work/verified/genesis.json" --systemd-follower --restart-and-snapshot || status=$?
          if [[ -f "$report" ]]; then
            sudo -n chown "$(id -u):$(id -g)" "$report"
          fi
          if (( status != 0 )); then
            jq -r '[.phase, (.error // .status)] | join(": ")' "$report" >&2
            exit "$status"
          fi
          jq -e --arg sha "$PUBLISHED_BINARY_SHA" --arg denom "$DENOM" \
            --arg genesis "$(jq -er .genesisSha256 "$work/evidence/assembly.json")" '
            .status == "PASS" and .loopbackOnlyNamespace and .binarySha256 == $sha and .genesisSha256 == $genesis and
            .rpc.nativeDenom == $denom and .systemdFollower.genesisSha256 == $genesis and .systemdRestart.sameHome and
            (.stateSync | .nativeDenom == $denom and .restoredHeight > 1 and .observerVotingPower == 0 and
              (.catchingUp | not) and .checkpointPreflight.status == "STATE_SYNC_CHECKPOINT_MATCH" and
              .checkpointPreflight.trustHash == .trustHash and .checkpointPreflight.trustHeight == .trustHeight) and
            (.historyRetention | .nativeDenom == $denom and .retainedBlockHeight == 1 and .archivedSupplyProofAvailable and
              .prunedSupplyProofUnavailable and .historicalABCIResponsesDisabled and .transactionSearchDisabled and
              .freshProofMatchesArchive and (.verifiedHeight > .loadedHeightAfterRestart))
            ' "$report" >/dev/null
      - name: Relay ICS-20 packets with the versioned binary
        if: (((inputs.published_ibc || inputs.mainnet_package_run) && matrix.profile == 'mainnet') || (inputs.testnet_package_run && matrix.profile == 'testnet')) && github.repository == 'maxwell2010/go-smart-node'
        run: |
          set -euo pipefail
          umask 077
          work="$PROFILE_WORK"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            'https://github.com/informalsystems/hermes/releases/download/v1.13.3/hermes-v1.13.3-x86_64-unknown-linux-gnu.tar.gz' \
            -o "$work/hermes.tar.gz"
          printf '%s  %s\n' 3582136824ac1984c8884b310c63940a1489f091fa45faca38ed80e5dfe7d51b \
            "$work/hermes.tar.gz" | sha256sum --check --strict
          tar -xzf "$work/hermes.tar.gz" -C "$work" hermes
          go build -mod=readonly -p 2 -trimpath -o "$work/ibcreference" ./internal/ibcreference
          MCND_SPONSORED_IBC_DONOR_FILE="$work/fixture-donor.hex" \
            go test -mod=readonly -p 2 -count=1 -timeout 4m \
            -run '^TestExportSponsoredLaunchIBCDonor$' ./systemcontracts
          report="$work/evidence/published-ibc.json"
          base_binary="$work/published/mcnd"
          base_sha="$PUBLISHED_BINARY_SHA"
          base_source="$PUBLISHED_SOURCE"
          replacement=()
          if [[ "$MSP_RELEASE_SWITCH" == true && "$PROFILE" == mainnet ]]; then
            base_binary="$work/predecessor/mcnd"
            base_sha="$PREDECESSOR_BINARY_SHA"
            base_source="$PREDECESSOR_SOURCE"
            replacement=(--replacement-binary "$work/published/mcnd" --replacement-sha256 "$PUBLISHED_BINARY_SHA"
                         --replacement-source-commit "$PUBLISHED_SOURCE")
          fi
          status=0
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$work" "$(command -v python3)" -B "$PWD/internal/ibclab/hermes_lab.py" \
            --mode native-full --network-profile "$PROFILE" \
            --mcnd-binary "$base_binary" --mcnd-sha256 "$base_sha" --mcnd-source-commit "$base_source" \
            "${replacement[@]}" \
            --reference-binary "$work/ibcreference" --reference-source-commit "$GITHUB_SHA" \
            --reference-sha256 "$(sha256sum "$work/ibcreference" | cut -d' ' -f1)" \
            --hermes-binary "$work/hermes" --native-fixture "$work/assembled" \
            --assembly-report "$work/evidence/assembly.json" --fixture-donor-key "$work/fixture-donor.hex" \
            --report "$report" || status=$?
          if [[ -f "$report" ]]; then
            sudo -n chown "$(id -u):$(id -g)" "$report"
          fi
          if (( status != 0 )); then
            jq -r '.error // .status' "$report" >&2
            exit "$status"
          fi
          jq -e --arg sha "$base_sha" --arg source "$base_source" \
            --arg chain "mintcandy_${EVM_ID}-1" --arg denom "$DENOM" \
            --arg genesis "$(jq -er .genesisSha256 "$work/evidence/assembly.json")" '
              .status == "NATIVE_CONSENSUS_HERMES_PASS" and .release_gate and
              .binaries.mcnd == {sha256: $sha, source_commit: $source} and
              .owned_probe.chain == $chain and .owned_probe.native_denom == $denom and
              .owned_probe.genesis_sha256 == $genesis and .owned_probe.replicas == 4 and
              .native_final_consensus.signers == ["a", "b", "c", "d"] and .relayer_funding.genesis_unchanged and
              .routePreflight.status == "IBC_ROUTE_STATE_MATCH" and .routePreflight.receiptsUnchanged and
              (.phases | keys == ["client_connection_channel_handshake", "daemon_live_relay", "daemon_restart_backlog",
                "error_ack_refund", "foreign_bank_voucher", "foreign_bank_voucher_return", "native_send",
                "pending_packet_restart", "timeout_refund", "voucher_return"]) and
              all(.phases[]; .status == "PASS" and all(.owned_fees[]; .denom == $denom)) and
              (.phases.native_send.owned_fees | length > 0) and
              (.phases.pending_packet_restart.preserved_packets | length == 1) and
              (.phases.daemon_restart_backlog | .sequence == (.commitment_before_restart.sequence | tostring))
            ' "$report" >/dev/null
          if [[ "$MSP_RELEASE_SWITCH" == true && "$PROFILE" == mainnet ]]; then
            jq -e --arg sha "$PUBLISHED_BINARY_SHA" --arg source "$PUBLISHED_SOURCE" '
              .publishedReleaseSwitch as $switch | .phases.pending_packet_restart as $phase |
              .binaries.replacement == {sha256: $sha, source_commit: $source} and
              $switch.successorCheckpoint.signers == ["a", "b", "c", "d"] and
              ($switch.beforeSignerHeights | length == 4) and ($switch.successorSignerHeights | length == 4) and
              $phase.native_after_restart.height > $switch.successorCheckpoint.height and
              $switch.ackCount == 1 and $switch.acknowledgedSequence == ($phase.preserved_packets[0].sequence | tostring)
              ' "$report" >/dev/null
          fi
      - name: Package the exact tested daemon and offline launch tools
        run: |
          set -euo pipefail
          umask 077
          work="$PROFILE_WORK"
          kit="$work/candidate"
          output="$work/output"
          archive="mintcandy-$PROFILE-candidate-linux-amd64.tar.gz"
          mkdir -m 700 -- "$kit" "$output"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          scripts=(check_operator_applications check_public_launch_draft configure_history install_validator_genesis
                   mcnd_process_smoke native_launch_allocation native_launch_package prepare_founding_ledger
                   public_genesis_manifest verify_public_launch_genesis withdrawal_genesis_smoke consensus_health
                   verify_state_sync_checkpoint)
          inputs=(LICENSE network/docs/ru/{INSTALL_LAUNCH_TOOLS.md,OPERATOR_LAUNCH.md,VALIDATOR_LAUNCH_INTAKE.md}
                  network/docs/ru/{public-genesis.draft.json,public-launch-allocation.draft.json,operator-launch-intake.example.json}
                  network/docs/ru/{public-genesis-msp.draft.json,public-launch-allocation-msp.draft.json}
                  network/docs/ru/evidence/software-release-1.1.5.json)
          for script in "${scripts[@]}"; do inputs+=("network/tools/$script.py"); done
          mapfile -d '' notices < <(git -C "$GITHUB_WORKSPACE" ls-files -z -- \
            network/LICENSE ':(glob)network/systemcontracts/LICENSE*' ':(glob)network/third_party/**/LICENSE*' \
            ':(glob)network/third_party/**/COPYING*' ':(glob)network/third_party/**/NOTICE*')
          git -C "$GITHUB_WORKSPACE" archive --format=tar "$GITHUB_SHA" -- "${inputs[@]}" "${notices[@]}" \
            | tar -xf - -C "$kit"
          install -D -m 0755 -- "$work/verified/bin/mcnd" "$kit/bin/mcnd"
          install -m 0755 -- "$work/mcnd-genesis" "$work/comet-commit-probe" "$kit/bin/"
          install -d -m 0700 -- "$kit/evidence"
          install -m 0600 -- "$work/evidence/"{assembly,network,package,retention}.json "$kit/evidence/"
          install -m 0600 -- "$work/evidence/"*.jsonl "$kit/evidence/"
          go version -m "$kit/bin/"{mcnd,mcnd-genesis,comet-commit-probe} > "$kit/BUILD_INFO.txt"
          sha256() { sha256sum "$1" | cut -d' ' -f1; }
          jq -n --arg revision "$GITHUB_SHA" --arg tag "mintcandy_$PROFILE" --arg profile "$PROFILE" \
            --arg chain "mintcandy_${EVM_ID}-1" --arg evm "$EVM_ID" --arg denom "$DENOM" --arg symbol "$SYMBOL" \
            --arg binary "$(sha256 "$kit/bin/mcnd")" --arg assembler "$(sha256 "$kit/bin/mcnd-genesis")" \
            '{status:"ci-candidate", profile:$profile, sourceRevision:$revision, buildTag:$tag, chainId:$chain,
              evmChainId:$evm, nativeDenom:$denom, nativeSymbol:$symbol, binarySha256:$binary,
              assemblerSha256:$assembler, includesGenesis:false, networkLaunchAuthorized:false}' > "$kit/PACKAGE.json"
          printf '%s\n' 'CI candidate from loopback-only tests. No public genesis or launch approval is included.' \
            'Verify the outer archive SHA256, GitHub attestation and internal SHA256SUMS before use.' > "$kit/README-CI.txt"
          (
            cd "$kit"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict --quiet SHA256SUMS
          )
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$output/$archive" -C "$kit" .
          (
            cd "$output"
            sha256sum "$archive" > "$archive.sha256"
            sha256sum --check --strict --quiet "$archive.sha256"
          )
          (
            extract=$(mktemp -d "$work/extract.XXXXXX")
            tar --no-same-owner --no-same-permissions -xzf "$output/$archive" -C "$extract"
            cd "$extract"
            sha256sum --check --strict --quiet SHA256SUMS
            cmp bin/mcnd "$work/verified/bin/mcnd"
            cmp bin/mcnd-genesis "$work/mcnd-genesis"
            bin/mcnd version >/dev/null
            bin/mcnd-genesis founder-proof --help >/dev/null
            python3 -B network/tools/public_genesis_manifest.py install-observer --help >/dev/null
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mintcandy-${{ matrix.profile }}-candidate-${{ github.run_attempt }}
          path: ${{ env.PROFILE_WORK }}/output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && env.PROFILE_WORK != ''
        with:
          name: mintcandy-${{ matrix.profile }}-rehearsal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PROFILE_WORK }}/evidence/
          if-no-files-found: ignore
          retention-days: 14

  attest-candidates:
    needs: isolated-launch
    if: github.repository == 'maxwell2010/go-smart-node' && github.ref == 'refs/heads/codex/mintcandy-native-denoms'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        profile: [mainnet, testnet]
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: mintcandy-${{ matrix.profile }}-candidate-linux-amd64.tar.gz
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mintcandy-${{ matrix.profile }}-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the tested archive checksum
        working-directory: ${{ runner.temp }}/candidate
        run: sha256sum --check --strict --quiet "$ARCHIVE.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: provenance
        with:
          subject-path: ${{ runner.temp }}/candidate/${{ env.ARCHIVE }}
          create-storage-record: false
      - name: Verify the provenance against this commit and workflow
        working-directory: ${{ runner.temp }}/candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$ATTESTATION_BUNDLE" provenance.sigstore.json
          gh attestation verify "$ARCHIVE" --bundle provenance.sigstore.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mintcandy-native-profiles.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners --format json > attestation-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attested-mintcandy-${{ matrix.profile }}-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
