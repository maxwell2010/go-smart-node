name: Published MintCandy node rehearsal

on:
  workflow_dispatch:
  push:
    branches: ['feat/native-duplicate-vote-master-20261112']
    paths: ['.github/workflows/published-node-rehearsal.yml']

permissions:
  contents: read
  attestations: read

concurrency:
  group: published-node-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    if: github.repository == 'maxwell2010/go-smart-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_TAG: v1.1.0
      RELEASE_VERSION: 1.1.0
      RELEASE_SOURCE: b90b5a9348658627a54d0e5b5002ee1d1b394cc2
      RELEASE_REF: refs/heads/feat/native-duplicate-vote-master-20261112
      RELEASE_ARCHIVE_SHA: f1233a4b8ea396115bdb7cf8c28e3fb4a2029ba7a77fe10f4db7ed9a557267a5
      RELEASE_BINARY_SHA: ed7e3a7478fe193f9d3748faeb5af95ab8421b7620237dba1a3873983ee7b3b4
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SOURCE }}
          persist-credentials: false
      - name: Install the published archive with the documented verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          release_work=$(mktemp -d "$RUNNER_TEMP/published-mcnd.XXXXXXXX")
          echo "RELEASE_WORK=$release_work" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$release_work/assets" "$release_work/evidence" "$release_work/fixture"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$RELEASE_SOURCE"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null
          archive_name="mcnd-$RELEASE_VERSION-linux-amd64.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$release_work/assets" \
            --pattern "$archive_name" --pattern "$archive_name.sha256" --pattern provenance.sigstore.json
          (
            cd "$release_work/assets"
            printf '%s  %s\n' "$RELEASE_ARCHIVE_SHA" "$archive_name" | cmp - "$archive_name.sha256"
            sha256sum --check --strict "$archive_name.sha256"
          )
          python3 -B network/tools/install_software.py \
            --source-sha "$RELEASE_SOURCE" --source-ref "$RELEASE_REF" \
            --release-version "$RELEASE_VERSION" --archive-sha "$RELEASE_ARCHIVE_SHA" \
            --archive "$release_work/assets/$archive_name" --bundle "$release_work/assets/provenance.sigstore.json" \
            --destination "$release_work/bin/mcnd" > "$release_work/evidence/install.json"
          jq -e --arg sha "$RELEASE_BINARY_SHA" --arg commit "$RELEASE_SOURCE" --arg version "$RELEASE_VERSION" \
            '.binarySha256 == $sha and .sourceRevision == $commit and .releaseVersion == $version and .includesGenesis == false and .networkLaunchApproved == false' \
            "$release_work/evidence/install.json" >/dev/null
          printf '%s  %s\n' "$RELEASE_BINARY_SHA" "$release_work/bin/mcnd" | sha256sum --check --strict
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Generate the isolated four-validator genesis and signature checker
        shell: bash
        working-directory: network
        run: |
          set -euo pipefail
          umask 077
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          export MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$RELEASE_WORK/fixture"
          export MCND_NATIVE_LAUNCH_REHEARSAL=4-empty
          if ! (
            go test -mod=readonly -p 2 -count=1 -timeout 8m -json \
              -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts &&
            MCND_NATIVE_LAUNCH_VERIFY=1 go test -mod=readonly -p 2 -count=1 -timeout 8m -json \
              -run '^TestOwnedAppNativeLaunchPreview$' ./systemcontracts
          ) > "$RELEASE_WORK/fixture.log" 2>&1; then
            echo 'Isolated launch genesis generation failed.'
            sed -nE 's/.*([ /])(native_(consensus|launch)[[:alnum:]_]*\.go:[0-9]+).*/\2/p' "$RELEASE_WORK/fixture.log" | sort -u
            exit 1
          fi
          go build -mod=readonly -p 2 -trimpath -o "$RELEASE_WORK/comet-commit-probe" ./tools/comet_commit_probe
          python3 -B tools/native_launch_allocation.py --genesis "$RELEASE_WORK/fixture/public/genesis.json" \
            --output "$RELEASE_WORK/evidence/allocation.json" \
            --allocation-plan docs/ru/public-launch-allocation.draft.json
      - name: Verify quorum recovery, follower replay and systemd snapshot sync
        shell: bash
        run: |
          set -euo pipefail
          run_rehearsal() {
            local name="$1"
            shift
            local status=0 report="$RELEASE_WORK/evidence/$name.json"
            sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
              env TMPDIR="$RELEASE_WORK" "$(command -v python3)" -B "$GITHUB_WORKSPACE/network/tools/native_launch_rehearsal.py" \
              --binary "$RELEASE_WORK/bin/mcnd" --binary-sha256 "$RELEASE_BINARY_SHA" \
              --archive-sha256 "$RELEASE_ARCHIVE_SHA" --source-commit "$RELEASE_SOURCE" \
              --fixture "$RELEASE_WORK/fixture" --home-parent "$RELEASE_WORK" \
              --report "$report" --four-validators --empty-user-assets "$@" || status=$?
            if [[ -f "$report" ]]; then
              sudo -n chown "$(id -u):$(id -g)" "$report"
              chmod 600 "$report"
            fi
            return "$status"
          }
          run_rehearsal quorum --quorum-loss-recovery --commit-probe "$RELEASE_WORK/comet-commit-probe"
          run_rehearsal systemd --package-genesis "$RELEASE_WORK/fixture/public/genesis.json" \
            --systemd-follower --restart-and-snapshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && env.RELEASE_WORK != ''
        with:
          name: published-mcnd-1.1.0-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_WORK }}/evidence/*.json
          if-no-files-found: warn
          retention-days: 30
