name: Attested MintCandy node rehearsal

on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [all, node, ibc, tools, media, retention, approvals, release-switch, release-restore, release-restore-ibc]
        default: all
      candidate_run:
        description: Successful software packaging run ID (empty uses the pinned release)
        type: string
      candidate_attempt:
        description: Software packaging run attempt
        type: string
      candidate_version:
        description: Candidate version without the v prefix
        type: string
      candidate_source:
        description: Candidate source commit (40 lowercase hex digits)
        type: string
      candidate_archive_sha:
        description: Candidate archive SHA256
        type: string
      candidate_binary_sha:
        description: Candidate installed binary SHA256
        type: string
  push:
    branches: ['feat/native-duplicate-vote-master-20261112']
    paths: ['.github/workflows/published-node-rehearsal.yml']

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: published-node-rehearsal-${{ github.ref }}-${{ inputs.scenario || 'all' }}-${{ inputs.candidate_run || 'published' }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    if: github.repository == 'maxwell2010/go-smart-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_TAG: v1.1.5
      RELEASE_VERSION: ${{ inputs.candidate_version || '1.1.5' }}
      RELEASE_SOURCE: ${{ inputs.candidate_source || '4becaf3d78a74e7b4e19300f6df5d8b4946576df' }}
      RELEASE_REF: refs/heads/feat/native-duplicate-vote-master-20261112
      RELEASE_ARCHIVE_SHA: ${{ inputs.candidate_archive_sha || '38dcd15eb7ff2ac6445f3b20af222f46332732b646e7f1e6f6318a889d9dd6c8' }}
      RELEASE_BINARY_SHA: ${{ inputs.candidate_binary_sha || '016943857fd4c9a929b1922c540a222afb93e4e5bcbd1ac74f3ccaf78f41cd0d' }}
      RELEASE_PACKAGE_RUN: ${{ inputs.candidate_run }}
      RELEASE_PACKAGE_ATTEMPT: ${{ inputs.candidate_attempt }}
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      REHEARSAL_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Validate candidate coordinates before checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - "$GITHUB_EVENT_PATH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          inputs = json.loads(Path(sys.argv[1]).read_text())['inputs']
          patterns = {
              'candidate_run': r'[1-9][0-9]{0,19}',
              'candidate_attempt': r'[1-9][0-9]{0,5}',
              'candidate_version': r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',
              'candidate_source': r'[0-9a-f]{40}',
              'candidate_archive_sha': r'[0-9a-f]{64}',
              'candidate_binary_sha': r'[0-9a-f]{64}',
          }
          values = {name: inputs.get(name, '') for name in patterns}
          if any(values.values()):
              for name, value in values.items():
                  if not re.fullmatch(patterns[name], value):
                      sys.exit(f'Missing or invalid {name}')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SOURCE }}
          persist-credentials: false
      - name: Install the exact attested archive with the documented verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          release_work=$(mktemp -d "$RUNNER_TEMP/attested-mcnd.XXXXXXXX")
          echo "RELEASE_WORK=$release_work" >> "$GITHUB_ENV"
          mkdir -m 700 -- "$release_work/assets" "$release_work/evidence" "$release_work/fixture"
          archive_name="mcnd-$RELEASE_VERSION-linux-amd64.tar.gz"
          if [[ -n "$RELEASE_PACKAGE_RUN" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_PACKAGE_RUN" \
              | jq -e --arg commit "$RELEASE_SOURCE" --arg repo "$GITHUB_REPOSITORY" \
                  --arg ref "${RELEASE_REF#refs/heads/}" --argjson attempt "$RELEASE_PACKAGE_ATTEMPT" \
                '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch"
                 and .head_sha == $commit and .head_branch == $ref and .head_repository.full_name == $repo
                 and .path == ".github/workflows/modern-network-development.yml" and .run_attempt == $attempt' >/dev/null
            for kind in package attestation; do
              gh run download "$RELEASE_PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$release_work/assets" \
                --name "mcnd-software-$kind-$RELEASE_SOURCE-$RELEASE_PACKAGE_ATTEMPT"
            done
          else
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            test "$tag_sha" = "$RELEASE_SOURCE"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$release_work/assets" \
              --pattern "$archive_name" --pattern "$archive_name.sha256" --pattern provenance.sigstore.json
          fi
          (
            cd "$release_work/assets"
            printf '%s  %s\n' "$RELEASE_ARCHIVE_SHA" "$archive_name" | cmp - "$archive_name.sha256"
            sha256sum --check --strict "$archive_name.sha256"
          )
          python3 -B network/tools/install_software.py \
            --source-sha "$RELEASE_SOURCE" --source-ref "$RELEASE_REF" \
            --release-version "$RELEASE_VERSION" --archive-sha "$RELEASE_ARCHIVE_SHA" \
            --archive "$release_work/assets/$archive_name" --bundle "$release_work/assets/provenance.sigstore.json" \
            --destination "$release_work/bin/mcnd" > "$release_work/evidence/install.json"
          jq -e --arg sha "$RELEASE_BINARY_SHA" --arg commit "$RELEASE_SOURCE" --arg version "$RELEASE_VERSION" \
            '.binarySha256 == $sha and .sourceRevision == $commit and .releaseVersion == $version and .includesGenesis == false and .networkLaunchApproved == false' \
            "$release_work/evidence/install.json" >/dev/null
          printf '%s  %s\n' "$RELEASE_BINARY_SHA" "$release_work/bin/mcnd" | sha256sum --check --strict
      - name: Capture launch parameters from the installed binary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          defaults_home=$(mktemp -d "$RELEASE_WORK/defaults.XXXXXXXX")
          binary="$RELEASE_WORK/bin/mcnd"
          env -i PATH="$PATH" HOME="$defaults_home" TZ=UTC "$binary" init launch-parameter-review \
            --home "$defaults_home" --chain-id mintcandy_990013-1 --evm.evm-chain-id 990013 >/dev/null 2>&1
          env -i PATH="$PATH" HOME="$defaults_home" TZ=UTC "$binary" genesis validate-genesis \
            --home "$defaults_home" --evm.evm-chain-id 990013 >/dev/null 2>&1
          python3 -B - "$defaults_home" "$RELEASE_WORK/evidence" <<'PY'
          import json
          from pathlib import Path
          import sys
          import tomllib

          home, evidence = map(Path, sys.argv[1:])
          config = home / 'config'
          genesis = json.loads((config / 'genesis.json').read_bytes())
          install = json.loads((evidence / 'install.json').read_bytes())
          state = genesis['app_state']
          consensus = genesis['consensus']
          assert genesis['chain_id'] == 'mintcandy_990013-1' and genesis['initial_height'] == 1
          assert not consensus.get('validators') and not state['bank'].get('balances')
          assert not state.get('withdrawal_settlement') and not state['validator'].get('validators')
          gov = state['gov']['params']
          for field in ('min_deposit', 'expedited_min_deposit'):
              assert len(gov[field]) == 1 and gov[field][0]['denom'] == 'del'
          with (config / 'app.toml').open('rb') as source:
              app = tomllib.load(source)
          metadata = next(row for row in state['bank']['denom_metadata'] if row['base'] == 'del')
          report = dict(
              status='INSTALLED_BINARY_DEFAULTS', chainId=genesis['chain_id'],
              releaseVersion=install['releaseVersion'], sourceRevision=install['sourceRevision'],
              binarySha256=install['binarySha256'], genesisValidatePassed=True,
              publicGenesisApproved=False, consensus=consensus['params'],
              feeMarket=state['feemarket']['params'], governance=gov,
              nativeValidators=state['validator']['params'], mint=state['mint'],
              displayDenom=metadata['display'], denomUnits=metadata['denom_units'],
              localMinimumGasPrices=app['minimum-gas-prices'],
          )
          with (evidence / 'default-launch-parameters.json').open('x', encoding='utf-8') as out:
              json.dump(report, out, indent=2, sort_keys=True)
              out.write('\n')
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Generate the disposable operator fixture
        shell: bash
        working-directory: network
        run: |
          set -euo pipefail
          umask 077
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          export MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$RELEASE_WORK/fixture"
          export MCND_NATIVE_LAUNCH_REHEARSAL=4-empty-sponsored
          if ! (
            go test -mod=readonly -p 2 -count=1 -timeout 8m -json \
              -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts &&
            MCND_NATIVE_LAUNCH_VERIFY=1 go test -mod=readonly -p 2 -count=1 -timeout 8m -json \
              -run '^TestOwnedAppNativeLaunchPreview$' ./systemcontracts
          ) > "$RELEASE_WORK/fixture.log" 2>&1; then
            echo 'Isolated launch genesis generation failed.'
            sed -nE 's/.*([ /])(native_(consensus|launch)[[:alnum:]_]*\.go:[0-9]+).*/\2/p' "$RELEASE_WORK/fixture.log" | sort -u
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: launch-assembly
          persist-credentials: false
      - name: Build the isolated genesis with the offline assembler
        shell: bash
        working-directory: launch-assembly/network
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go mod verify
          git diff --exit-code -- go.mod go.sum
          root="$RELEASE_WORK"
          mkdir -m 700 -p "$root/assembled/public"
          go test -mod=readonly -p 2 -count=1 -timeout 2m ./tools/comet_commit_probe
          go test -mod=readonly -p 2 -count=1 -timeout 2m -run '^TestLaunchConsent' ./launchgenesis
          go build -mod=readonly -p 2 -trimpath -o "$root/comet-commit-probe" ./tools/comet_commit_probe
          go build -mod=readonly -p 2 -trimpath -o "$root/mcnd-genesis" ./cmd/mcnd-genesis
          "$root/mcnd-genesis" addresses --chain-id mintcandy_990014-1 --evm-chain-id 990014 > "$root/roles.json"
          python3 -B tools/test_founding_ledger_fixture.py --source "$root/fixture" --roles "$root/roles.json" --output "$root/ledger.json"
          genesis="$root/assembled/public/genesis.json"
          inputs=(--ledger "$root/ledger.json" --parameters tools/fixtures/founding-genesis-ci-parameters.json --genesis "$genesis")
          "$root/mcnd-genesis" build "${inputs[@]}"
          "$root/mcnd-genesis" verify "${inputs[@]}" > "$root/evidence/assembly.json"
          jq -e '.wrappedTokenSymbol == "WMSP"' "$root/evidence/assembly.json" >/dev/null
          install -m 600 "$genesis" "$root/assembled/genesis.json"
          install -m 600 "$root/fixture/"priv_validator_key_{a,b,c,d}.json "$root/assembled/"
          jq '{chainId, evmChainId, actor, actorNative,
            validators: [.validators[] | {name, initialPower, consensusAddress, publicKey}]}' \
            "$root/fixture/expectations.json" > "$root/assembled/expectations.json"
          MCND_FOUNDING_LEDGER_SOURCE="$root/fixture" MCND_FOUNDING_LEDGER_FIXTURE="$root/assembled" MCND_FOUNDING_LEDGER_ROLES="$root/roles.json" \
            python3 -B -m unittest discover -s tools -p test_founding_ledger_fixture.py -v
          python3 -B tools/native_launch_allocation.py --genesis "$genesis" \
            --output "$RELEASE_WORK/evidence/allocation.json" \
            --allocation-plan docs/ru/public-launch-allocation.draft.json
      - name: Package the verified build and offline operator tools
        if: inputs.scenario == 'tools'
        working-directory: launch-assembly
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RELEASE_WORK"
          kit="$root/launch-kit"
          output="$RUNNER_TEMP/launch-tools-package"
          name=mintcandy-launch-tools-linux-amd64.tar.gz
          mkdir -m 700 -- "$kit" "$output"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          inputs=(LICENSE network/docs/ru/{INSTALL_LAUNCH_TOOLS.md,public-genesis.draft.json,public-launch-allocation.draft.json,operator-launch-intake.example.json,evidence/software-release-1.1.5.json})
          for script in check_operator_applications check_public_launch_draft configure_history install_validator_genesis \
                        mcnd_process_smoke native_launch_allocation native_launch_package prepare_founding_ledger \
                        public_genesis_manifest verify_public_launch_genesis withdrawal_genesis_smoke \
                        consensus_health verify_state_sync_checkpoint; do
            inputs+=("network/tools/$script.py")
          done
          mapfile -d '' notices < <(git ls-files -z -- network/LICENSE ':(glob)network/systemcontracts/LICENSE*' \
            ':(glob)network/third_party/**/LICENSE*' ':(glob)network/third_party/**/COPYING*' ':(glob)network/third_party/**/NOTICE*')
          git archive --format=tar "$GITHUB_SHA" -- "${inputs[@]}" "${notices[@]}" | tar -xf - -C "$kit"
          install -D -m 0755 -- "$root/mcnd-genesis" "$kit/bin/mcnd-genesis"
          go version -m "$kit/bin/mcnd-genesis" > "$kit/BUILD_INFO.txt"
          grep -Fq $'\tpath\tgithub.com/maxwell2010/go-smart-node/network/cmd/mcnd-genesis' "$kit/BUILD_INFO.txt"
          grep -Fq "vcs.revision=$GITHUB_SHA" "$kit/BUILD_INFO.txt"
          grep -Fq 'vcs.modified=false' "$kit/BUILD_INFO.txt"
          grep -Fq 'GOOS=linux' "$kit/BUILD_INFO.txt"
          grep -Fq 'GOARCH=amd64' "$kit/BUILD_INFO.txt"
          binary_sha=$(sha256sum "$kit/bin/mcnd-genesis" | cut -d' ' -f1)
          jq -n --arg source "$GITHUB_SHA" --arg binary "$binary_sha" --arg release "$RELEASE_VERSION" \
            --arg daemon "$RELEASE_BINARY_SHA" \
            '{schemaVersion: 1, scope: "offline-launch-tools", platform: "linux/amd64", sourceRevision: $source,
              assemblerSha256: $binary, compatibleMcndVersion: $release, compatibleMcndSha256: $daemon,
              includesRunnableGenesis: false, includesValidatorKeys: false, networkLaunchAuthorized: false}' > "$kit/PACKAGE.json"
          (
            cd "$kit"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - . | gzip -n > "$output/$name"
          )
          (cd "$output" && sha256sum "$name" > "$name.sha256")
          fresh="$root/launch-kit-unpacked"
          mkdir -m 700 -- "$fresh"
          tar --no-same-owner --no-same-permissions -xzf "$output/$name" -C "$fresh"
          (
            cd "$fresh"
            sha256sum --check --strict SHA256SUMS >/dev/null
            python3 -B network/tools/check_public_launch_draft.py > "$root/evidence/packaged-tools-draft.json"
            python3 -B network/tools/check_operator_applications.py network/docs/ru/operator-launch-intake.example.json \
              | jq -e '.status == "APPLICATIONS_PENDING" and .checkedOperators == 0 and .missingSlots == 4'
            for script in prepare_founding_ledger verify_public_launch_genesis public_genesis_manifest verify_state_sync_checkpoint; do
              python3 -B "network/tools/$script.py" --help >/dev/null
            done
            cmp bin/mcnd-genesis "$root/mcnd-genesis"
            bin/mcnd-genesis verify --ledger "$root/ledger.json" \
              --parameters "$GITHUB_WORKSPACE/launch-assembly/network/tools/fixtures/founding-genesis-ci-parameters.json" \
              --genesis "$root/assembled/public/genesis.json" | cmp - "$root/evidence/assembly.json"
          )
      - name: Verify and unpack the published offline toolkit for the approvals rehearsal
        if: inputs.scenario == 'approvals'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -z "$RELEASE_PACKAGE_RUN"
          root="$RELEASE_WORK"
          mkdir -m 700 "$root/tools-assets" "$root/published-tools"
          cd "$root/tools-assets"
          name=mintcandy-launch-tools-linux-amd64.tar.gz
          record="$GITHUB_WORKSPACE/launch-assembly/network/docs/ru/evidence/launch-tools-$RELEASE_VERSION.json"
          source=$(jq -er '.sourceRevision | select(test("^[a-f0-9]{40}$"))' "$record")
          digest=$(jq -er '.archiveSha256 | select(test("^[a-f0-9]{64}$"))' "$record")
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$name" --pattern "$name.sha256" --pattern launch-tools.sigstore.json
          printf '%s  %s\n' "$digest" "$name" | cmp - "$name.sha256"
          sha256sum --check --strict "$name.sha256"
          gh attestation verify "$name" --bundle launch-tools.sigstore.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/published-node-rehearsal.yml" \
            --source-ref "$RELEASE_REF" --source-digest "$source" --signer-digest "$source" --deny-self-hosted-runners
          tar --no-same-owner --no-same-permissions -xzf "$name" -C "$root/published-tools"
          cd "$root/published-tools"
          sha256sum --check --strict SHA256SUMS >/dev/null
          jq -e --arg source "$source" --arg version "$RELEASE_VERSION" --arg daemon "$RELEASE_BINARY_SHA" \
            '.sourceRevision == $source and .compatibleMcndVersion == $version and .compatibleMcndSha256 == $daemon and
            .networkLaunchAuthorized == false and .includesRunnableGenesis == false and .includesValidatorKeys == false' PACKAGE.json
      - name: Prepare a disposable validator home with the published daemon
        shell: bash
        working-directory: launch-assembly/network
        run: |
          set -euo pipefail
          root="$RELEASE_WORK"
          report="$root/evidence/validator-install.json"
          assembler="$root/mcnd-genesis"
          consent_manifest=""
          if [[ "$REHEARSAL_SCENARIO" == tools ]]; then assembler="$root/launch-kit-unpacked/bin/mcnd-genesis"; fi
          if [[ "$REHEARSAL_SCENARIO" == approvals ]]; then
            assembler="$root/published-tools/bin/mcnd-genesis"
            consent_manifest="$root/consent-manifest.json"
          fi
          candidate_record=""
          if [[ -n "$RELEASE_PACKAGE_RUN" ]]; then
            candidate_record="$root/installed-candidate.json"
            jq -e --arg archive "$RELEASE_ARCHIVE_SHA" \
              '{releaseVersion,sourceRevision,binarySha256,archiveSha256:$archive}' \
              "$root/evidence/install.json" > "$candidate_record"
          fi
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$root" MCND_VALIDATOR_INSTALL_BINARY="$root/bin/mcnd" \
            MCND_VALIDATOR_INSTALL_ASSEMBLER="$assembler" \
            MCND_VALIDATOR_INSTALL_FIXTURE="$root/assembled" MCND_VALIDATOR_INSTALL_REPORT="$report" \
            MCND_VALIDATOR_INSTALL_CANDIDATE_RECORD="$candidate_record" \
            MCND_VERIFIED_CONSENT_MANIFEST="$consent_manifest" \
            "$(command -v python3)" -B -m unittest discover -s tools -p test_install_validator_genesis.py -v
          sudo -n chown "$(id -u):$(id -g)" "$report"
          sha=$(sha256sum "$root/assembled/public/genesis.json" | cut -d' ' -f1)
          jq -e --arg sha "$sha" --arg binary "$RELEASE_BINARY_SHA" \
            '.status == "VALIDATOR_GENESIS_INSTALLED" and .genesisSha256 == $sha and .binarySha256 == $binary and
            .chainId == "mintcandy_990014-1" and .idempotent and .rejectsForeignKey and .rejectsExistingState and .consentPayloadVerified and
            (.preservedHomeFiles >= 5) and (.networkLaunchAuthorized | not)' "$report"
      - name: Verify all four offline operator signatures against the installed genesis
        if: inputs.scenario == 'approvals'
        shell: bash
        working-directory: launch-assembly/network
        run: |
          set -euo pipefail
          root="$RELEASE_WORK"
          go test -mod=readonly -p 2 -c -o "$root/operator-consent.test" ./systemcontracts
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$root" MCND_APPROVAL_REHEARSAL_ROOT="$root" "$root/operator-consent.test" \
            -test.v -test.timeout=1m -test.run '^TestVerifyPublishedFoundingOperatorApprovals$'
          report="$root/evidence/operator-consents.json"
          sudo -n chown "$(id -u):$(id -g)" "$report"
          jq -e --arg manifest "$(jq -r .manifestSha256 "$root/evidence/validator-install.json")" \
            '.status == "FOUR_OPERATOR_ACKNOWLEDGMENTS_VERIFIED" and (.verifiedOperators | length == 4) and
            .manifestSha256 == $manifest and .chainId == "mintcandy_990014-1" and .networkLaunchAuthorized == false' "$report"
      - name: Verify quorum recovery, follower replay and systemd snapshot sync
        if: github.event_name == 'push' || inputs.scenario == 'all' || inputs.scenario == 'node'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s launch-assembly/network/tools -p 'test_verify_state_sync_checkpoint.py' -v
          run_rehearsal() {
            local name="$1"
            shift
            local status=0 report="$RELEASE_WORK/evidence/$name.json"
            sudo -n unshare --net -- bash -euc '
              ip link set lo up
              # Keep the late-starting snapshot observer P2P and RPC ports out of the client port pool.
              reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
              sysctl -qw "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}33656-33657"
              exec "$@"
            ' _ \
              env TMPDIR="$RELEASE_WORK" "$(command -v python3)" -B "$GITHUB_WORKSPACE/launch-assembly/network/tools/native_launch_rehearsal.py" \
              --binary "$RELEASE_WORK/bin/mcnd" --binary-sha256 "$RELEASE_BINARY_SHA" \
              --archive-sha256 "$RELEASE_ARCHIVE_SHA" --source-commit "$RELEASE_SOURCE" \
              --fixture "$RELEASE_WORK/assembled" --home-parent "$RELEASE_WORK" \
              --assembly-report "$RELEASE_WORK/evidence/assembly.json" \
              --report "$report" --four-validators --empty-user-assets "$@" || status=$?
            if [[ -f "$report" ]]; then
              sudo -n chown "$(id -u):$(id -g)" "$report"
              chmod 600 "$report"
            fi
            return "$status"
          }
          run_rehearsal quorum --quorum-loss-recovery --commit-probe "$RELEASE_WORK/comet-commit-probe"
          run_rehearsal systemd --package-genesis "$RELEASE_WORK/assembled/public/genesis.json" \
            --systemd-follower --restart-and-snapshot
          genesis_sha=$(sha256sum "$RELEASE_WORK/assembled/public/genesis.json" | cut -d' ' -f1)
          jq -e --arg sha "$genesis_sha" '.status == "PASS" and .loopbackOnlyNamespace and .offlineAssembledGenesis and
            .genesisSha256 == $sha and .followerVotingPower == 0 and .quorumRecovery.verifiedEd25519Signatures == 3 and
            .fourSignerRecovery.verifiedEd25519Signatures == 4 and
            (.foundingCommitProof | .status == "FOUNDING_COMMIT_VERIFIED" and .genesisSha256 == $sha and
              .height == 1 and .matchingEndpoints == 2 and .modifiedAppHashRejected and .totalPower == 40000 and
              .signedPower >= 30000)' "$RELEASE_WORK/evidence/quorum.json"
          jq -e --arg sha "$genesis_sha" '.status == "PASS" and .loopbackOnlyNamespace and .offlineAssembledGenesis and
            .genesisSha256 == $sha and .systemdFollower.genesisSha256 == $sha and
            .systemdRestart.sameHome and .wrappedTokenSymbol == "WMSP" and (.stateSync |
              .restoredHeight > 1 and .checkpointPreflight.status == "STATE_SYNC_CHECKPOINT_MATCH" and
              .checkpointPreflight.trustHash == .trustHash and .checkpointPreflight.trustHeight == .trustHeight) and
            (.historyRetention | .retainedBlockHeight == 1 and .archivedSupplyProofAvailable and
              .prunedSupplyProofUnavailable and .historicalABCIResponsesDisabled and .transactionSearchDisabled and
              .freshProofMatchesArchive and (.verifiedHeight > .loadedHeightAfterRestart)) and
            (.resourceUsage | (.signingValidators | length == 3) and
              ([.systemdFollower, .snapshotObserver, .signingValidators[]] |
                all(.peakResidentBytes > 0 and .dataAllocatedBytes > 0)))' "$RELEASE_WORK/evidence/systemd.json"
      - name: Verify Comet block pruning and restart while preserving the evidence window
        if: github.event_name == 'push' || inputs.scenario == 'all' || inputs.scenario == 'retention'
        shell: bash
        run: |
          set -euo pipefail
          root="$RELEASE_WORK"
          report="$root/evidence/blockstore.json"
          status=0
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$root" "$(command -v python3)" -B "$GITHUB_WORKSPACE/launch-assembly/network/tools/native_launch_rehearsal.py" \
            --binary "$root/bin/mcnd" --binary-sha256 "$RELEASE_BINARY_SHA" \
            --archive-sha256 "$RELEASE_ARCHIVE_SHA" --source-commit "$RELEASE_SOURCE" \
            --fixture "$root/assembled" --home-parent "$root" --assembly-report "$root/evidence/assembly.json" \
            --report "$report" --four-validators --empty-user-assets --block-retention || status=$?
          if [[ -f "$report" ]]; then sudo -n chown "$(id -u):$(id -g)" "$report"; fi
          test "$status" = 0
          genesis_sha=$(sha256sum "$root/assembled/public/genesis.json" | cut -d' ' -f1)
          jq -e --arg sha "$genesis_sha" --arg binary "$RELEASE_BINARY_SHA" \
            '.status == "PASS" and .loopbackOnlyNamespace and .binarySha256 == $binary and .genesisSha256 == $sha and
            (.blockstoreGenesisSha256 | test("^[a-f0-9]{64}$")) and .blockstoreGenesisSha256 != $sha and
            (.blockstoreRetention | .evidenceWindowBlocks == 24 and .minRetainBlocks == 10 and
              .earliestBeforeRestart > 1 and .earliestAfterRestart >= .earliestBeforeRestart and
              .verifiedHeight > .loadedHeightAfterRestart and .historicalBlockStillAvailableOnArchive and
              .sameAppHashOnFiveReplicas and (.appHash | test("^[A-Fa-f0-9]{64}$")))' "$report"
      - name: Verify media publication after a signed user token creation
        if: inputs.scenario == 'media'
        shell: bash
        working-directory: launch-assembly/network
        run: |
          set -euo pipefail
          umask 077
          root="$RELEASE_WORK"
          fixture="$root/media"
          genesis="$root/assembled/public/genesis.json"
          mkdir -m 700 "$fixture"
          python3 -m venv "$root/media-venv"
          py="$root/media-venv/bin/python"
          "$py" -m pip install --only-binary=:all: --require-hashes -r media/requirements-linux-cp312.lock
          "$py" -B - "$fixture" <<'PY'
          from pathlib import Path
          from sys import argv
          from PIL import Image

          root = Path(argv[1])
          (root / 'metadata.json').write_text('{"name":"Launch avatar fixture"}')
          Image.new('RGB', (6, 6), '#12ccaa').save(root / 'avatar.png')
          PY
          PYTHONPATH="$PWD/media" "$py" -B -m mcnd_media.commitment prepare \
            --chain-id mintcandy_990014-1 --kind erc20 --mime image/png \
            --metadata "$fixture/metadata.json" --image "$fixture/avatar.png" > "$fixture/prepare.json"
          MCND_MEDIA_URI="$(jq -er '.metadata_uri' "$fixture/prepare.json")" MCND_MEDIA_GENESIS="$genesis" \
            MCND_MEDIA_FIXTURE="$fixture/signed.json" \
            go test -mod=readonly -p 2 -count=1 -timeout 3m -run '^TestExportLaunchMediaCreation$' ./systemcontracts
          report="$root/evidence/media.json"
          status=0
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$root" "$py" -B tools/native_launch_rehearsal.py \
            --binary "$root/bin/mcnd" --binary-sha256 "$RELEASE_BINARY_SHA" \
            --archive-sha256 "$RELEASE_ARCHIVE_SHA" --source-commit "$RELEASE_SOURCE" \
            --fixture "$root/assembled" --home-parent "$root" --assembly-report "$root/evidence/assembly.json" \
            --four-validators --empty-user-assets --media-fixture "$fixture/signed.json" --report "$report" || status=$?
          if [[ -f "$report" ]]; then sudo -n chown "$(id -u):$(id -g)" "$report"; fi
          test "$status" = 0
          jq -e '.status == "PASS" and .loopbackOnlyNamespace and .chainId == "mintcandy_990014-1" and
            (.committedMedia | .status == "PASS" and .version == 1 and .kind == "erc20-reserveless" and .alteredMetadataRejected)' "$report"
      - name: Install the previous published daemon
        if: inputs.scenario == 'release-switch' || inputs.scenario == 'release-restore' || inputs.scenario == 'release-restore-ibc'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: launch-assembly
        run: |
          set -euo pipefail
          umask 077
          test -z "$RELEASE_PACKAGE_RUN"
          record=network/docs/ru/evidence/software-release-1.1.4.json
          source=$(jq -er '.sourceRevision | select(test("^[a-f0-9]{40}$"))' "$record")
          archive_sha=$(jq -er '.archiveSha256 | select(test("^[a-f0-9]{64}$"))' "$record")
          binary_sha=$(jq -er '.binarySha256 | select(test("^[a-f0-9]{64}$"))' "$record")
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.4" --jq '.object.sha')" = "$source"
          gh release view v1.1.4 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null
          root="$RELEASE_WORK/predecessor"
          mkdir -m 700 -- "$root"
          archive=mcnd-1.1.4-linux-amd64.tar.gz
          gh release download v1.1.4 --repo "$GITHUB_REPOSITORY" --dir "$root" \
            --pattern "$archive" --pattern provenance.sigstore.json
          python3 -B network/tools/install_software.py --source-sha "$source" --source-ref "$RELEASE_REF" \
            --release-version 1.1.4 --archive-sha "$archive_sha" --archive "$root/$archive" \
            --bundle "$root/provenance.sigstore.json" --destination "$root/mcnd" > "$RELEASE_WORK/evidence/predecessor-install.json"
          printf '%s  %s\n' "$binary_sha" "$root/mcnd" | sha256sum --check --strict
          printf 'PREDECESSOR_SOURCE=%s\nPREDECESSOR_BINARY_SHA=%s\nPREDECESSOR_ARCHIVE_SHA=%s\n' \
            "$source" "$binary_sha" "$archive_sha" >> "$GITHUB_ENV"
      - name: Verify systemd upgrade, IAVL schema change and backup restore across the published releases
        if: inputs.scenario == 'release-restore'
        shell: bash
        working-directory: launch-assembly/network
        run: |
          set -euo pipefail
          umask 077
          root="$RELEASE_WORK"
          genesis="$root/assembled/public/genesis.json"
          install -m 600 -- "$genesis" "$root/genesis.json"
          jq -e --arg archive "$RELEASE_ARCHIVE_SHA" --arg sha "$RELEASE_BINARY_SHA" --arg source "$RELEASE_SOURCE" '
            select(.binarySha256 == $sha and .sourceRevision == $source and .includesGenesis == false and .networkLaunchApproved == false) |
            {archiveSha256: $archive, binarySha256, sourceCommit: .sourceRevision}
          ' "$root/evidence/install.json" > "$root/replacement.json"
          go build -mod=readonly -p 2 -trimpath -o "$root/iavl-schema-probe" ./tools/iavl_schema_probe
          report="$root/evidence/release-restore.json"
          status=0
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$root" "$(command -v python3)" -B "$PWD/tools/native_launch_rehearsal.py" \
            --binary "$root/predecessor/mcnd" --binary-sha256 "$PREDECESSOR_BINARY_SHA" \
            --archive-sha256 "$PREDECESSOR_ARCHIVE_SHA" --source-commit "$PREDECESSOR_SOURCE" \
            --fixture "$root/assembled" --home-parent "$root" --assembly-report "$root/evidence/assembly.json" \
            --report "$report" --four-validators --empty-user-assets --package-genesis "$genesis" \
            --systemd-follower --upgrade-package "$root" --upgrade-package-report "$root/replacement.json" \
            --iavl-schema-probe "$root/iavl-schema-probe" || status=$?
          if [[ -f "$report" ]]; then
            sudo -n chown "$(id -u):$(id -g)" "$report"
            chmod 600 "$report"
          fi
          if [[ "$status" != 0 ]]; then
            jq -r '.phase, .error' "$report" >&2
            exit "$status"
          fi
          jq -e --arg old "$PREDECESSOR_BINARY_SHA" --arg new "$RELEASE_BINARY_SHA" '
            .status == "PASS" and .loopbackOnlyNamespace and .offlineAssembledGenesis and .followerVotingPower == 0 and
            .binarySha256 == $old and .systemdUpgrade.binarySha256 == $new and .systemdRollback.binarySha256 == $old and
            (.systemdUpgrade as $upgrade | .systemdRollback |
              .backupHomeSha256 == $upgrade.backupHomeSha256 and .loadedHeight == $upgrade.loadedHeight and
              .loadedAppHash == $upgrade.loadedAppHash and .verifiedHeight > $upgrade.verifiedHeight and
              .sameNodeId and $upgrade.sameNodeId and .catchingUp == false and $upgrade.catchingUp == false and
              $upgrade.iavlBefore.storageVersion == "1.0.0" and .iavlAfterUpgrade.storageVersion == "1.1.0" and
              .iavlRestored == $upgrade.iavlBefore and .iavlAfterSync.storageVersion == "1.0.0")
          ' "$report"
      - name: Verify Hermes interoperability on the same assembled genesis
        if: github.event_name == 'push' || inputs.scenario == 'all' || inputs.scenario == 'ibc' || inputs.scenario == 'release-switch' || inputs.scenario == 'release-restore-ibc'
        shell: bash
        working-directory: launch-assembly/network
        run: |
          set -euo pipefail
          umask 077
          python3 -B -m unittest discover -s internal/ibclab -p test_lab_guards.py -v
          python3 -B -m unittest discover -s tools -p test_verify_hermes_route.py -v
          root="$RELEASE_WORK"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/informalsystems/hermes/releases/download/v1.13.3/hermes-v1.13.3-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$root/hermes.tar.gz"
          printf '%s  %s\n' 3582136824ac1984c8884b310c63940a1489f091fa45faca38ed80e5dfe7d51b "$root/hermes.tar.gz" | sha256sum --check --strict
          tar -xzf "$root/hermes.tar.gz" -C "$root" hermes
          printf '%s  %s\n' ed8d57781f57a93e74259c12c8feee661b9633c882307f3a6236e41dbf5ffe35 "$root/hermes" | sha256sum --check --strict
          chmod 755 "$root/hermes"
          go build -mod=readonly -p 2 -trimpath -o "$root/ibcreference" ./internal/ibcreference
          reference_sha=$(sha256sum "$root/ibcreference" | cut -d' ' -f1)
          MCND_SPONSORED_IBC_DONOR_FILE="$root/fixture-donor.hex" \
            go test -mod=readonly -p 2 -count=1 -timeout 4m -run '^TestExportSponsoredLaunchIBCDonor$' ./systemcontracts
          report="$root/evidence/ibc.json"
          daemon=(--mcnd-binary "$root/bin/mcnd" --mcnd-sha256 "$RELEASE_BINARY_SHA" --mcnd-source-commit "$RELEASE_SOURCE")
          base_hash="$RELEASE_BINARY_SHA"
          if [[ "$REHEARSAL_SCENARIO" == release-switch || "$REHEARSAL_SCENARIO" == release-restore-ibc ]]; then
            base_hash="$PREDECESSOR_BINARY_SHA"
            daemon=(--mcnd-binary "$root/predecessor/mcnd" --mcnd-sha256 "$base_hash" --mcnd-source-commit "$PREDECESSOR_SOURCE"
                    --replacement-binary "$root/bin/mcnd" --replacement-sha256 "$RELEASE_BINARY_SHA" --replacement-source-commit "$RELEASE_SOURCE")
          fi
          if [[ "$REHEARSAL_SCENARIO" == release-restore-ibc ]]; then
            go build -mod=readonly -p 2 -trimpath -o "$root/iavl-schema-probe" ./tools/iavl_schema_probe
            daemon+=(--observer-schema-probe "$root/iavl-schema-probe")
          fi
          status=0
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            env TMPDIR="$root" "$(command -v python3)" -B "$GITHUB_WORKSPACE/launch-assembly/network/internal/ibclab/hermes_lab.py" \
            --mode native-full "${daemon[@]}" \
            --reference-binary "$root/ibcreference" --reference-sha256 "$reference_sha" --reference-source-commit "$GITHUB_SHA" \
            --hermes-binary "$root/hermes" --native-fixture "$root/assembled" --assembly-report "$root/evidence/assembly.json" \
            --fixture-donor-key "$root/fixture-donor.hex" --report "$report" || status=$?
          if [[ -f "$report" ]]; then
            sudo -n chown "$(id -u):$(id -g)" "$report"
            chmod 600 "$report"
          fi
          if [[ "$status" != 0 ]]; then
            jq -r '.error // .status' "$report" >&2
            exit "$status"
          fi
          genesis_sha=$(sha256sum "$root/assembled/public/genesis.json" | cut -d' ' -f1)
          jq -e --arg sha "$genesis_sha" --arg binary "$base_hash" \
            '.status == "NATIVE_CONSENSUS_HERMES_PASS" and .release_gate and .binaries.mcnd.sha256 == $binary and
            .owned_probe.genesis_sha256 == $sha and .owned_probe.replicas == 4 and .owned_probe.chain == "mintcandy_990014-1" and
            .routePreflight.status == "IBC_ROUTE_STATE_MATCH" and .routePreflight.receiptsUnchanged and
            (.routePreflight.chains | length == 2 and all(.clientStatus == "Active")) and
            .relayer_funding.genesis_unchanged and .native_final_consensus.signers == ["a","b","c","d"] and
            (.phases.daemon_restart_backlog | .sequence == (.commitment_before_restart.sequence | tostring)) and
            (.phases | keys == ["client_connection_channel_handshake","daemon_live_relay","daemon_restart_backlog","error_ack_refund","foreign_bank_voucher",
            "foreign_bank_voucher_return","native_send","pending_packet_restart","timeout_refund","voucher_return"]) and
            all(.phases[]; .status == "PASS") and
            (.resourceUsage | (.validatorsBeforeRestart | length == 4) and (.validatorsAfterRestart | length == 4) and
              ([.validatorsBeforeRestart[], .validatorsAfterRestart[]] | all(.peakResidentBytes > 0 and .dataAllocatedBytes > 0)) and
              .hermesBeforeRestart.peakResidentBytes > 0 and .hermesAfterRestart.peakResidentBytes > 0 and
              .mintcandyCommittedTransactions > 0 and .mintcandyGasUsed > 0)' "$report"
          if [[ "$REHEARSAL_SCENARIO" == release-switch ]]; then
            jq -e --arg successor "$RELEASE_BINARY_SHA" '
              .binaries.replacement.sha256 == $successor and
              .publishedReleaseSwitch.acknowledgedSequence == (.phases.pending_packet_restart.preserved_packets[0].sequence | tostring) and
              (.publishedReleaseSwitch | .ackCount == 1 and .successorCheckpoint.signers == ["a","b","c","d"] and
                (.beforeSignerHeights | length == 4) and (.successorSignerHeights | length == 4))
            ' "$report"
          fi
          if [[ "$REHEARSAL_SCENARIO" == release-restore-ibc ]]; then
            jq -e --arg old "$PREDECESSOR_BINARY_SHA" --arg new "$RELEASE_BINARY_SHA" '
              .phases.pending_packet_restart.preserved_packets as $packets |
              .systemdUpgrade as $upgrade | .systemdRollback as $rollback |
              ($packets | length == 1) and .observerRestoreIBC.ackCount == 1 and
              .observerRestoreIBC.acknowledgedSequence == ($packets[0].sequence | tostring) and
              $upgrade.binarySha256 == $new and $rollback.binarySha256 == $old and
              $upgrade.backupHomeSha256 == $rollback.backupHomeSha256 and
              $upgrade.loadedHeight == $rollback.loadedHeight and $upgrade.loadedAppHash == $rollback.loadedAppHash and
              $upgrade.applicationState == $rollback.applicationState and
              $upgrade.applicationState.commitments == $packets and $upgrade.applicationState.escrowAtomic == "1000000000000000000" and
              $upgrade.iavlBefore.storageVersion == "1.0.0" and $rollback.iavlAfterUpgrade.storageVersion == "1.1.0" and
              $rollback.iavlRestored == $upgrade.iavlBefore and $rollback.iavlAfterSync.storageVersion == "1.0.0"
            ' "$report"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.scenario == 'tools'
        with:
          name: launch-tools-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launch-tools-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && env.RELEASE_WORK != ''
        with:
          name: attested-mcnd-${{ env.RELEASE_VERSION }}-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_WORK }}/evidence/*.json
          if-no-files-found: warn
          retention-days: 30
  attest-launch-tools:
    needs: linux-amd64
    if: inputs.scenario == 'tools' && github.repository == 'maxwell2010/go-smart-node' && github.ref == 'refs/heads/feat/native-duplicate-vote-master-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: launch-tools-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launch-tools/
      - name: Check exact archive before attesting
        working-directory: ${{ runner.temp }}/launch-tools
        run: sha256sum --check --strict mintcandy-launch-tools-linux-amd64.tar.gz.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: provenance
        with:
          subject-path: ${{ runner.temp }}/launch-tools/mintcandy-launch-tools-linux-amd64.tar.gz
          push-to-registry: false
          create-storage-record: false
      - name: Verify the archive against pinned GitHub provenance
        working-directory: ${{ runner.temp }}/launch-tools
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$ATTESTATION_BUNDLE" launch-tools.sigstore.json
          gh attestation verify mintcandy-launch-tools-linux-amd64.tar.gz --bundle launch-tools.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/published-node-rehearsal.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners --format json > attestation-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attested-mintcandy-launch-tools-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launch-tools/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
