name: Linux candidate artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Alpha version (for example 0.1.0-alpha.1)
        required: true
        default: 0.1.0-alpha.1
  push:
    branches: ['release/**', 'integration/**']

permissions:
  contents: read

concurrency:
  group: linux-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [ordinary, experimental_ibc]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOMAXPROCS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.4'
          cache: true
      - name: Install isolated SBOM schema validator
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/sbom-validator" --requirement scripts/release/requirements-sbom.txt
          echo "PYTHONPATH=$RUNNER_TEMP/sbom-validator" >> "$GITHUB_ENV"
      - name: Test SBOM parser and official schemas
        run: python3 -m unittest discover -s scripts/release -p "test_*.py"
      - name: Test security scan capture and gates
        run: python3 -m unittest discover -s scripts/audit -p "test_*.py"
      - name: Verify dependency cache integrity
        run: |
          mkdir -p candidate-logs
          go mod download
          git diff --exit-code -- go.mod go.sum
          go mod verify |& tee candidate-logs/dependency-integrity.log
      - name: Test application and isolated protocol baseline
        run: |
          mkdir -p candidate-logs
          go test -mod=readonly -p 2 -count=1 -v -timeout 10m ./... |& tee candidate-logs/tests.log
          for test in TestIntegrationUpgradeCrashRealEVM TestIntegrationAutoUnbondRealEVM TestIntegrationEventRollbackRealEVM; do
            grep -q -- "^--- PASS: ${test} " candidate-logs/tests.log
          done
      - name: Build pinned official external relayer from source
        if: matrix.flavor == 'experimental_ibc'
        run: |
          mkdir -p "$RUNNER_TEMP/relayer-bin"
          go mod download -json github.com/cosmos/relayer/v2@v2.6.0 > "$RUNNER_TEMP/relayer-source.json"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["Sum"] == "h1:JPUs8fyhC+Sz/lqBaITehf98NUqM6hru6QIFgUVKpYA=", "Unexpected relayer source checksum"' "$RUNNER_TEMP/relayer-source.json"
          GOBIN="$RUNNER_TEMP/relayer-bin" go install github.com/cosmos/relayer/v2@v2.6.0
          echo "DSC_IBC_RELAYER_BINARY=$RUNNER_TEMP/relayer-bin/relayer" >> "$GITHUB_ENV"
      - name: Test experimental DSC wiring and admission policy
        if: matrix.flavor == 'experimental_ibc'
        env:
          DSC_IBC_PROCESS_SMOKE: '1'
          DSC_IBC_FIXTURE_DIR: '@test-temp'
        run: |
          go test -mod=readonly -p 2 -count=1 -v -timeout 10m -tags experimental_ibc -run '^(TestExperimental|TestExportIsolatedICS20Fixtures)' ./app ./app/ante ./integrationconfig |& tee candidate-logs/experimental.log
      - name: Build identical binaries and package source provenance
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '0.1.0-alpha.1' }}
        run: bash scripts/release/build-linux-candidate.sh "$CANDIDATE_VERSION" "$RUNNER_TEMP/candidate" "${{ matrix.flavor }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-${{ matrix.flavor }}-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-validation-${{ matrix.flavor }}-${{ github.run_id }}
          path: candidate-logs/
          retention-days: 30
          if-no-files-found: warn
