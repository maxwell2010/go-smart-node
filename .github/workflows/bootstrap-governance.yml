name: MintCandy bootstrap governance

on:
  push:
    branches: ['feat/bootstrap-unanimous-governance']
    paths: ['network/**', '.github/workflows/bootstrap-governance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [mintcandy_testnet, mintcandy_mainnet]
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    defaults:
      run:
        working-directory: network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Exercise bootstrap decisions and governance settlement in memory
        run: |
          set -euo pipefail
          for tags in "${{ matrix.profile }}" "${{ matrix.profile }},mintcandy_bootstrap_unanimity"; do
            args=(-mod=readonly -p 2 -tags "$tags" -count=1 -timeout 8m -v)
            # The EVM chain configuration may only be initialized once per process.
            go test "${args[@]}" -run '^TestBootstrapUnanimity(Vote|StakeOwners)$' ./app
            go test "${args[@]}" -run '^TestBootstrapUnanimityFourLaunchOperatorsAndFounder$' ./app
            go test "${args[@]}" -run '^TestBootstrapUnanimousQueueAndSDKSettlement$' ./app
            if [[ "$tags" == *,mintcandy_bootstrap_unanimity ]]; then
              go test "${args[@]}" -run '^TestBootstrapBallotSimulatesFinalGas$' ./app
            fi
            go test "${args[@]}" -run 'Bootstrap|Unanimous' ./decimal/validator/keeper
            if [[ "$tags" == mintcandy_testnet,mintcandy_bootstrap_unanimity ]]; then
              go test "${args[@]}" -run '^TestBootstrapUnanimityUpgradeApproval$' ./app
            fi
          done
      - name: Rehearse a voted upgrade and unanimous close on four loopback validators
        if: matrix.profile == 'mintcandy_testnet'
        run: bash tools/ci_bootstrap_governance.sh
      - name: Export public receipts and matching headers
        if: matrix.profile == 'mintcandy_testnet' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-governance-tmsp-${{ github.sha }}
          path: ${{ runner.temp }}/bootstrap-governance-result.json
          if-no-files-found: error
          retention-days: 14
