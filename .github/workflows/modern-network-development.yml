name: Modern network development artifacts
on:
  workflow_dispatch:
    inputs:
      security_audit:
        description: Check the exact daemon and source with pinned govulncheck
        default: false
        type: boolean
      launch_rehearsal:
        description: Start packaged validators and replay block 1 on an ordinary peer in a private network
        default: false
        type: boolean
      launch_four_validators:
        description: Rehearse the proposed four equal stakes and synchronize a peer after one validator stops
        default: false
        type: boolean
      launch_treasury:
        description: Check two and three signatures on a DEL transfer from the four-validator test treasury
        default: false
        type: boolean
      launch_signed_package:
        description: Sign and verify a test launch package before starting its daemon and genesis
        default: false
        type: boolean
      systemd_package_run:
        description: Run ID containing the signed test package to install and boot under systemd
        type: string
      systemd_package_sha256:
        description: Expected SHA256 of the previously published test archive
        type: string
      systemd_package_fingerprint:
        description: Trusted OpenPGP fingerprint from the signing run
        type: string
      systemd_restart_snapshot:
        description: Restart the systemd follower and restore a separate peer from a P2P snapshot
        default: false
        type: boolean
      systemd_upgrade_rollback:
        description: Upgrade the systemd follower from a new signed package and restore its offline backup
        default: false
        type: boolean
  push:
    branches: ['integration/**', 'release/**']
    paths: ['network/**', '.github/workflows/modern-network-development.yml']
permissions:
  contents: read
concurrency:
  group: mcnd-artifact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOAMD64: 'v1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Install isolated SBOM schema validator
        if: ${{ !inputs.systemd_package_run }}
        run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/sbom-validator" --requirement scripts/release/requirements-sbom.txt
      - name: Verify sources and operator tooling
        run: |
          python3 network/scripts/verify_owned_evm.py
          python3 network/scripts/verify_owned_geth.py
          python3 network/scripts/verify_owned_sdk.py
          python3 -m unittest discover -s network/tools -p 'test_*.py'
      - name: Build pinned development daemon
        if: ${{ !inputs.systemd_package_run }}
        run: |
          cd network
          go mod download
          go mod verify
          python3 scripts/verify_pion_transport.py
          python3 scripts/verify_owned_sdk.py --compiled
          git diff --exit-code -- go.mod go.sum
          python3 tools/source_inventory.py --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/mcnd-source-inputs.json"
          go build -mod=readonly -tags= -p 2 -trimpath -ldflags "-X main.buildCommit=$GITHUB_SHA" -o "$RUNNER_TEMP/mcnd" ./cmd/mcnd
          "$RUNNER_TEMP/mcnd" version
      - name: Check installation and generated retention from the packaged daemon
        if: ${{ !inputs.systemd_package_run }}
        run: |
          python3 network/tools/package_mcnd.py --binary "$RUNNER_TEMP/mcnd" --source "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" --source-inputs "$RUNNER_TEMP/mcnd-source-inputs.json" --output "development-artifacts/mcnd-development-linux-amd64.tar.gz"
          install_dir=$(mktemp -d "$RUNNER_TEMP/mcnd-install.XXXXXXXX")
          (
            cd development-artifacts
            sha256sum --check --strict mcnd-development-linux-amd64.tar.gz.sha256
            tar -xOzf mcnd-development-linux-amd64.tar.gz bin/mcnd > "$install_dir/mcnd"
            tar -xOzf mcnd-development-linux-amd64.tar.gz SBOM.cdx.json > "$install_dir/SBOM.cdx.json"
          )
          PYTHONPATH="$RUNNER_TEMP/sbom-validator" python3 scripts/release/validate_sbom.py "$install_dir/SBOM.cdx.json"
          cmp "$RUNNER_TEMP/mcnd" "$install_dir/mcnd"
          chmod 0755 "$install_dir/mcnd"
          "$install_dir/mcnd" version
          "$install_dir/mcnd" init config-check --home "$install_dir/home" --chain-id mintcandy_990003-1 --evm.evm-chain-id 990003 > /dev/null 2>&1
          python3 network/tools/configure_history.py --home "$install_dir/home" --apply --role rpc-ibc
      - name: Download the previously signed test package
        if: inputs.systemd_package_run
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEMD_PACKAGE_RUN: ${{ inputs.systemd_package_run }}
        run: |
          set -euo pipefail
          [[ "$SYSTEMD_PACKAGE_RUN" =~ ^[1-9][0-9]*$ ]]
          mkdir -m 700 -- "$RUNNER_TEMP/mcnd-systemd-download"
          timeout 150 gh run download "$SYSTEMD_PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mcnd-signed-test-launch-*' --dir "$RUNNER_TEMP/mcnd-systemd-download"
      - name: Rehearse fresh launch using the exact packaged daemon
        if: inputs.launch_rehearsal || inputs.launch_four_validators || inputs.launch_treasury || inputs.launch_signed_package || inputs.systemd_package_run || inputs.systemd_upgrade_rollback
        shell: bash
        env:
          LAUNCH_FOUR_VALIDATORS: ${{ inputs.launch_four_validators }}
          LAUNCH_TREASURY: ${{ inputs.launch_treasury }}
          LAUNCH_SIGNED_PACKAGE: ${{ inputs.launch_signed_package }}
          SYSTEMD_PACKAGE_RUN: ${{ inputs.systemd_package_run }}
          SYSTEMD_PACKAGE_SHA256: ${{ inputs.systemd_package_sha256 }}
          SYSTEMD_PACKAGE_FINGERPRINT: ${{ inputs.systemd_package_fingerprint }}
          SYSTEMD_RESTART_SNAPSHOT: ${{ inputs.systemd_restart_snapshot }}
          SYSTEMD_UPGRADE_ROLLBACK: ${{ inputs.systemd_upgrade_rollback }}
        run: |
          set -euo pipefail
          umask 077
          launch_work=$(mktemp -d "$RUNNER_TEMP/mcnd-launch.XXXXXXXX")
          fixture="$launch_work/fixture"
          evidence="$RUNNER_TEMP/mcnd-launch-evidence"
          mkdir -m 700 -- "$fixture" "$evidence"
          launch_revision="$GITHUB_SHA"
          launch_binary="$launch_work/mcnd"
          export MCND_NATIVE_CONSENSUS_FIXTURE_DIR="$fixture"
          export MCND_NATIVE_LAUNCH_REHEARSAL=1
          launch_options=()
          allocation_options=()
          if [[ "$SYSTEMD_RESTART_SNAPSHOT" == true ]]; then
            [[ -n "$SYSTEMD_PACKAGE_RUN" ]]
            launch_options+=(--restart-and-snapshot)
          fi
          if [[ "$SYSTEMD_UPGRADE_ROLLBACK" == true ]]; then
            [[ -n "$SYSTEMD_PACKAGE_RUN" ]]
          fi
          if [[ "$LAUNCH_FOUR_VALIDATORS" == true || "$LAUNCH_TREASURY" == true || "$LAUNCH_SIGNED_PACKAGE" == true || -n "$SYSTEMD_PACKAGE_RUN" ]]; then
            export MCND_NATIVE_LAUNCH_REHEARSAL=4
            launch_options+=(--four-validators)
            allocation_options+=(--allocation-plan network/docs/ru/public-launch-allocation.draft.json)
          fi
          if [[ "$LAUNCH_TREASURY" == true ]]; then
            export MCND_NATIVE_TREASURY_PROCESS=1
            launch_options+=(--treasury-transfer)
          fi
          if [[ -n "$SYSTEMD_PACKAGE_RUN" ]]; then
            [[ "$LAUNCH_SIGNED_PACKAGE" != true ]]
            [[ "$SYSTEMD_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$SYSTEMD_PACKAGE_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
            shopt -s nullglob
            archives=("$RUNNER_TEMP/mcnd-systemd-download"/*/mcnd-test-launch-linux-amd64.tar.gz)
            (( ${#archives[@]} == 1 ))
            signed_archive=${archives[0]}
            printf '%s  %s\n' "$SYSTEMD_PACKAGE_SHA256" "$signed_archive" | sha256sum --check --strict
            tar -xOzf "$signed_archive" release-key.gpg > "$launch_work/trusted-keyring.gpg"
            verified_package="$launch_work/verified-package"
            python3 -B network/tools/native_launch_package.py verify \
              --archive "$signed_archive" --trusted-keyring "$launch_work/trusted-keyring.gpg" \
              --signer-fingerprint "$SYSTEMD_PACKAGE_FINGERPRINT" --output-dir "$verified_package" > "$evidence/package.json"
            archive_sha=$(jq -er '.archiveSha256' "$evidence/package.json")
            [[ "$archive_sha" == "$SYSTEMD_PACKAGE_SHA256" ]]
            binary_sha=$(jq -er '.binarySha256' "$evidence/package.json")
            launch_revision=$(jq -er '.sourceCommit' "$evidence/package.json")
            launch_binary="$verified_package/bin/mcnd"
            launch_options+=(--package-genesis "$verified_package/genesis.json" --systemd-follower)
          else
            archive_name=mcnd-development-linux-amd64.tar.gz
            archive="$GITHUB_WORKSPACE/development-artifacts/$archive_name"
            (cd development-artifacts && sha256sum --check --strict "$archive_name.sha256")
            archive_sha=$(sha256sum "$archive" | awk '{print $1}')
            tar -xOzf "$archive" bin/mcnd > "$launch_binary"
            cmp "$RUNNER_TEMP/mcnd" "$launch_binary"
            chmod 0755 "$launch_binary"
            binary_sha=$(sha256sum "$launch_binary" | awk '{print $1}')
          fi
          if ! (
              cd network
              go test -mod=readonly -tags= -p 2 -count=1 -timeout 8m -json \
                -run '^TestOwnedAppSignedRegistryBootstrap$/^authenticated_isolated_position_reader$' ./systemcontracts &&
              MCND_NATIVE_LAUNCH_VERIFY=1 go test -mod=readonly -tags= -p 2 -count=1 -timeout 8m -json \
                -run '^TestOwnedAppNativeLaunchPreview$' ./systemcontracts
            ) > "$launch_work/fixture.log" 2>&1; then
            echo 'Private launch genesis fixture failed.'
            sed -nE 's/.*([ /])(native_(consensus|launch|treasury)[[:alnum:]_]*\.go:[0-9]+).*/\2/p' "$launch_work/fixture.log" | sort -u
            exit 1
          fi
          launch_genesis="$fixture/public/genesis.json"
          if [[ -n "$SYSTEMD_PACKAGE_RUN" ]]; then
            launch_genesis="$verified_package/genesis.json"
          fi
          if [[ "$LAUNCH_SIGNED_PACKAGE" == true || "$SYSTEMD_UPGRADE_ROLLBACK" == true ]]; then
            signed_binary="$launch_binary"
            signed_report="$evidence/package.json"
            signed_extract="$launch_work/verified-package"
            if [[ "$SYSTEMD_UPGRADE_ROLLBACK" == true ]]; then
              signed_binary="$launch_work/mcnd-upgrade"
              signed_report="$evidence/upgrade-package.json"
              signed_extract="$launch_work/verified-upgrade"
              [[ "$GITHUB_SHA" != "$launch_revision" ]]
              (
                cd network
                go mod verify
                go build -mod=readonly -tags= -p 2 -trimpath -ldflags "-X main.buildCommit=$GITHUB_SHA" \
                  -o "$signed_binary" ./cmd/mcnd
              )
            fi
            signer_home=$(mktemp -d "$launch_work/gnupg.XXXXXXXX")
            gpg --homedir "$signer_home" --batch --no-tty --pinentry-mode loopback --passphrase '' \
              --quick-generate-key "MintCandy launch CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ed25519 sign 0
            signer_fingerprint=$(gpg --homedir "$signer_home" --batch --with-colons --list-keys | awk -F: '$1 == "fpr" {print $10}')
            [[ "$signer_fingerprint" =~ ^[A-F0-9]{40}$ ]]
            trusted_keyring="$launch_work/new-signing-keyring.gpg"
            gpg --homedir "$signer_home" --batch --export "$signer_fingerprint" > "$trusted_keyring"
            printf 'Trusted test signing fingerprint: %s\n' "$signer_fingerprint"
            signed_archive="$evidence/mcnd-test-launch-linux-amd64.tar.gz"
            python3 -B network/tools/native_launch_package.py build \
              --binary "$signed_binary" --genesis "$launch_genesis" --source-commit "$GITHUB_SHA" \
              --output "$signed_archive" --signer-home "$signer_home" --signer-fingerprint "$signer_fingerprint"
            python3 -B network/tools/native_launch_package.py verify \
              --archive "$signed_archive" --trusted-keyring "$trusted_keyring" --signer-fingerprint "$signer_fingerprint" \
              --output-dir "$signed_extract" > "$signed_report"
            signed_archive_sha=$(sha256sum "$signed_archive" | awk '{print $1}')
            signed_binary_sha=$(sha256sum "$signed_binary" | awk '{print $1}')
            genesis_sha=$(sha256sum "$launch_genesis" | awk '{print $1}')
            jq -e --arg commit "$GITHUB_SHA" --arg signer "$signer_fingerprint" --arg binary "$signed_binary_sha" \
              --arg genesis "$genesis_sha" --arg archive "$signed_archive_sha" \
              '.sourceCommit == $commit and .signerFingerprint == $signer and .binarySha256 == $binary and
               .genesisSha256 == $genesis and .archiveSha256 == $archive' "$signed_report" > /dev/null
            cat "$signed_report"
            if [[ "$SYSTEMD_UPGRADE_ROLLBACK" == true ]]; then
              [[ "$signed_archive_sha" != "$archive_sha" && "$signed_binary_sha" != "$binary_sha" ]]
              launch_options+=(--upgrade-package "$signed_extract" --upgrade-package-report "$signed_report")
            else
              [[ "$signed_binary_sha" == "$binary_sha" ]]
              launch_binary="$signed_extract/bin/mcnd"
              archive_sha="$signed_archive_sha"
              launch_genesis="$signed_extract/genesis.json"
              launch_options+=(--package-genesis "$launch_genesis")
            fi
          fi
          launch_status=0
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
              env TMPDIR="$launch_work" "$(command -v python3)" -B "$GITHUB_WORKSPACE/network/tools/native_launch_rehearsal.py" \
              --binary "$launch_binary" --binary-sha256 "$binary_sha" --archive-sha256 "$archive_sha" \
              --source-commit "$launch_revision" --fixture "$fixture" --home-parent "$launch_work" \
              --report "$evidence/network.json" "${launch_options[@]}" || launch_status=$?
          if [[ -f "$evidence/network.json" ]]; then
            sudo -n chown "$(id -u):$(id -g)" "$evidence/network.json"
            chmod 600 "$evidence/network.json"
          fi
          (( launch_status == 0 )) || exit "$launch_status"
          install -m 600 -- "$launch_genesis" "$evidence/genesis.json"
          python3 -B network/tools/native_launch_allocation.py --genesis "$evidence/genesis.json" \
            --output "$evidence/allocation.json" "${allocation_options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && (inputs.launch_rehearsal || inputs.launch_four_validators || inputs.launch_treasury || inputs.launch_signed_package || inputs.systemd_package_run)
        with:
          name: mcnd-launch-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mcnd-launch-evidence/genesis.json
            ${{ runner.temp }}/mcnd-launch-evidence/allocation.json
            ${{ runner.temp }}/mcnd-launch-evidence/network.json
            ${{ runner.temp }}/mcnd-launch-evidence/package.json
            ${{ runner.temp }}/mcnd-launch-evidence/upgrade-package.json
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.launch_signed_package || inputs.systemd_upgrade_rollback
        with:
          name: mcnd-signed-test-launch-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcnd-launch-evidence/mcnd-test-launch-linux-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Audit default daemon source and compiled binary
        if: inputs.security_audit && !inputs.systemd_package_run
        working-directory: network
        run: |
          audit_dir="$RUNNER_TEMP/mcnd-security"
          scanner="$RUNNER_TEMP/mcnd-audit-tools/govulncheck"
          mkdir -p "$audit_dir"
          GOBIN="$(dirname "$scanner")" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          sha256sum "$RUNNER_TEMP/mcnd" "$scanner" > "$audit_dir/sha256.txt"
          go version -m "$RUNNER_TEMP/mcnd" > "$audit_dir/build-info.txt"
          audit_status=0
          for mode in source binary; do
            target=./cmd/mcnd
            if [[ "$mode" == binary ]]; then target="$RUNNER_TEMP/mcnd"; fi
            if ! python3 ../scripts/audit/capture_govuln.py \
                --raw "$audit_dir/$mode.json" --manifest "$audit_dir/$mode.complete.json" \
                --source-commit "$GITHUB_SHA" --scope "default mcnd linux/amd64 CGO=1 $mode" \
                -- "$scanner" -json -mode "$mode" "$target"; then
              audit_status=1
            fi
            if ! python3 ../scripts/audit/govuln_gate.py "$audit_dir/$mode.json" \
                --manifest "$audit_dir/$mode.complete.json" > "$audit_dir/$mode.gate.json"; then
              audit_status=1
            fi
            cat "$audit_dir/$mode.gate.json"
          done
          exit "$audit_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.security_audit && !inputs.systemd_package_run
        with:
          name: mcnd-security-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcnd-security/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !inputs.systemd_package_run }}
        with:
          name: mcnd-development-linux-amd64-${{ github.sha }}
          path: development-artifacts/
          retention-days: 14
