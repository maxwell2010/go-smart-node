name: Modern network development artifacts
on:
  workflow_dispatch:
    inputs:
      security_audit:
        description: Check the exact daemon and source with pinned govulncheck
        default: false
        type: boolean
  push:
    branches: ['integration/**', 'release/**']
    paths: ['network/**', '.github/workflows/modern-network-development.yml']
permissions:
  contents: read
concurrency:
  group: mcnd-artifact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      CC: gcc
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOAMD64: 'v1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: network/go.sum
      - name: Verify sources and operator tooling
        run: |
          python3 network/scripts/verify_owned_evm.py
          python3 network/scripts/verify_owned_geth.py
          python3 network/scripts/verify_owned_sdk.py
          python3 -m unittest discover -s network/tools -p 'test_*.py'
      - name: Build pinned development daemon
        run: |
          cd network
          go mod download
          go mod verify
          python3 scripts/verify_pion_transport.py
          python3 scripts/verify_owned_sdk.py --compiled
          git diff --exit-code -- go.mod go.sum
          python3 tools/source_inventory.py --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/mcnd-source-inputs.json"
          go build -mod=readonly -tags= -p 2 -trimpath -ldflags "-X main.buildCommit=$GITHUB_SHA" -o "$RUNNER_TEMP/mcnd" ./cmd/mcnd
          "$RUNNER_TEMP/mcnd" version
      - name: Check installation and generated retention from the packaged daemon
        run: |
          python3 network/tools/package_mcnd.py --binary "$RUNNER_TEMP/mcnd" --source "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" --source-inputs "$RUNNER_TEMP/mcnd-source-inputs.json" --output "development-artifacts/mcnd-development-linux-amd64.tar.gz"
          install_dir=$(mktemp -d "$RUNNER_TEMP/mcnd-install.XXXXXXXX")
          (
            cd development-artifacts
            sha256sum --check --strict mcnd-development-linux-amd64.tar.gz.sha256
            tar -xOzf mcnd-development-linux-amd64.tar.gz bin/mcnd > "$install_dir/mcnd"
          )
          cmp "$RUNNER_TEMP/mcnd" "$install_dir/mcnd"
          chmod 0755 "$install_dir/mcnd"
          "$install_dir/mcnd" version
          "$install_dir/mcnd" init config-check --home "$install_dir/home" --chain-id mintcandy_990003-1 --evm.evm-chain-id 990003 > /dev/null 2>&1
          python3 network/tools/configure_history.py --home "$install_dir/home" --apply --role rpc-ibc
      - name: Audit default daemon source and compiled binary
        if: inputs.security_audit
        working-directory: network
        run: |
          audit_dir="$RUNNER_TEMP/mcnd-security"
          scanner="$RUNNER_TEMP/mcnd-audit-tools/govulncheck"
          mkdir -p "$audit_dir"
          GOBIN="$(dirname "$scanner")" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          sha256sum "$RUNNER_TEMP/mcnd" "$scanner" > "$audit_dir/sha256.txt"
          go version -m "$RUNNER_TEMP/mcnd" > "$audit_dir/build-info.txt"
          audit_status=0
          for mode in source binary; do
            target=./cmd/mcnd
            if [[ "$mode" == binary ]]; then target="$RUNNER_TEMP/mcnd"; fi
            if ! python3 ../scripts/audit/capture_govuln.py \
                --raw "$audit_dir/$mode.json" --manifest "$audit_dir/$mode.complete.json" \
                --source-commit "$GITHUB_SHA" --scope "default mcnd linux/amd64 CGO=1 $mode" \
                -- "$scanner" -json -mode "$mode" "$target"; then
              audit_status=1
            fi
            if ! python3 ../scripts/audit/govuln_gate.py "$audit_dir/$mode.json" \
                --manifest "$audit_dir/$mode.complete.json" > "$audit_dir/$mode.gate.json"; then
              audit_status=1
            fi
            cat "$audit_dir/$mode.gate.json"
          done
          exit "$audit_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.security_audit
        with:
          name: mcnd-security-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcnd-security/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcnd-development-linux-amd64-${{ github.sha }}
          path: development-artifacts/
          retention-days: 14
