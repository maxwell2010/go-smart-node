name: Isolated media storage validation
on:
  workflow_dispatch:
  push:
    branches: ['feat/native-duplicate-vote-master-20261112', 'integration/**', 'release/**']
    paths: ['network/media/**', '.github/workflows/media-validation.yml']
  pull_request:
    paths: ['network/media/**', '.github/workflows/media-validation.yml']
permissions:
  contents: read
jobs:
  decode-store-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MCND_MEDIA_TEST_FULL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned isolated image decoder
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/media-venv"
          "$RUNNER_TEMP/media-venv/bin/pip" install --only-binary=:all: --require-hashes \
            -r network/media/requirements-linux-cp312.lock -r network/media/requirements-api.lock
      - name: Unpack Nginx for the isolated localhost test
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/media-nginx.XXXXXXXX")
          cd "$directory"
          sudo apt-get update -qq
          apt-get download nginx
          dpkg-deb -x nginx_*.deb "$directory/extracted"
          "$directory/extracted/usr/sbin/nginx" -v
          echo "MCND_MEDIA_NGINX=$directory/extracted/usr/sbin/nginx" >> "$GITHUB_ENV"
      - name: Install Kubo for isolated IPFS interoperability
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/media-kubo.XXXXXXXX")
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/ipfs/kubo/releases/download/v0.43.1/kubo_v0.43.1_linux-amd64.tar.gz \
            --output "$directory/kubo.tar.gz"
          printf '%s  %s\n' 3f2bf974ab2a3ec6d997fac7d8cb46f59983a7cddd0b55ef998e6ce379155fb2 "$directory/kubo.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$directory/kubo.tar.gz" --directory "$directory" kubo/ipfs
          "$directory/kubo/ipfs" version
          echo "MCND_MEDIA_KUBO=$directory/kubo/ipfs" >> "$GITHUB_ENV"
      - name: Test decoding, HTTPS publication and delivery from restored media
        run: |
          set -euo pipefail
          command -v openssl
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec runuser -u "$SUDO_USER" -- "$@"' _ \
            env PYTHONPATH="$GITHUB_WORKSPACE/network/media" MCND_MEDIA_TEST_FULL=1 \
              MCND_MEDIA_NGINX="$MCND_MEDIA_NGINX" MCND_MEDIA_KUBO="$MCND_MEDIA_KUBO" \
              "$RUNNER_TEMP/media-venv/bin/python" -B -m unittest discover -v -s network/media/tests -p 'test_*.py' \
            2>&1 | tee "$RUNNER_TEMP/media-validation.log"
          git diff --exit-code
      - name: Install and restart the media service under systemd in a loopback namespace
        run: |
          set -euo pipefail
          sudo -n useradd --system --user-group --no-create-home --shell /usr/sbin/nologin mcnd-media
          sudo -n install -d -m 0755 /opt/mcnd-media/mcnd_media /etc/systemd/system/mcnd-media.service.d
          sudo -n install -m 0644 network/media/mcnd_media/*.py /opt/mcnd-media/mcnd_media/
          sudo -n python3 -m venv /opt/mcnd-media/venv
          sudo -n /opt/mcnd-media/venv/bin/python -m pip install --only-binary=:all: --require-hashes \
            -r network/media/requirements-linux-cp312.lock -r network/media/requirements-api.lock
          sudo -n install -m 0644 network/media/mcnd-media.service /etc/systemd/system/mcnd-media.service
          sudo -n ip netns add mcnd-media-ci
          trap 'sudo -n systemctl stop mcnd-media.service; sudo -n ip netns delete mcnd-media-ci' EXIT
          sudo -n ip -n mcnd-media-ci link set lo up
          printf '[Service]\nNetworkNamespacePath=/run/netns/mcnd-media-ci\n' \
            | sudo -n tee /etc/systemd/system/mcnd-media.service.d/isolate.conf >/dev/null
          sudo -n install -m 0600 /dev/null /etc/mcnd-media.env
          sudo -n systemd-analyze verify /etc/systemd/system/mcnd-media.service
          sudo -n systemctl daemon-reload
          sudo -n ip netns exec mcnd-media-ci \
            env PYTHONPATH="$GITHUB_WORKSPACE/network/media" MCND_MEDIA_SYSTEMD_CI=1 \
              /opt/mcnd-media/venv/bin/python -B -m unittest discover -v -s network/media/tests -p 'test_systemd.py' \
            2>&1 | tee "$RUNNER_TEMP/media-systemd.log"
      - name: Print service logs on failure
        if: failure()
        run: sudo -n journalctl --no-pager -u mcnd-media.service -n 100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: media-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/media-validation.log
            ${{ runner.temp }}/media-systemd.log
          if-no-files-found: warn
          retention-days: 30
