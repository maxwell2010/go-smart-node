name: Build offline DRC20 database rehearsal
on:
  push:
    branches: [audit/mainnet-drc20-ticker-copy]
    paths: ['network/**', '.github/workflows/offline-issuance-audit.yml']
permissions:
  contents: read
jobs:
  audit-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: network/go.sum
      - name: Compile isolated audit harness
        working-directory: network
        run: |
          go test -mod=readonly -p 2 -tags mintcandy_mainnet -c -o "$RUNNER_TEMP/ticker-audit.test" ./app
          cd "$RUNNER_TEMP"
          sha256sum ticker-audit.test > ticker-audit.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-ticker-audit
          path: |
            ${{ runner.temp }}/ticker-audit.test
            ${{ runner.temp }}/ticker-audit.sha256
          retention-days: 7
